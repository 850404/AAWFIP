name: Check funder websites for changes

on:
  schedule:
    # Runs daily at 06:00 UTC. Edit the cron expression to change the
    # frequency — e.g. '0 */6 * * *' for every 6 hours. GitHub Actions
    # free tier covers this comfortably for a job that runs in seconds.
    - cron: '0 6 * * *'
  workflow_dispatch: {} # lets you trigger a check manually from the Actions tab

permissions:
  contents: write # needed to commit the updated snapshot back to the repo

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check each funder's website
        run: node scripts/check-funders.mjs

      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/funder-web-snapshot.json
          git diff --cached --quiet || git commit -m "Update funder website snapshot [automated]"
          git push
