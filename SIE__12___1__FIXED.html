<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SIE — Strategic Intelligence Engine</title>
<style>
/* ================================================================
   SIE — Strategic Intelligence Engine (standalone)
   ----------------------------------------------------------------
   Completely independent of AAWFIP: this file has its own markup,
   its own styles, and its own script. It does not load, import, or
   reference any AAWFIP file or JavaScript module. On startup it only
   reads the AAWFIP_StrategicDatabase key that AAWFIP's own
   "Synchronise Strategic Intelligence" button writes to in the
   browser's localStorage — nothing is written automatically, and
   AAWFIP's own file, code, and storage are never touched or modified
   just by opening or using this page.

   The one exception is the explicit Backup > Import (Restore) action
   in the header: only when a person picks a backup JSON file and
   confirms the restore in the on-screen dialog does this file call
   localStorage.setItem on that same AAWFIP_StrategicDatabase key, to
   write the restored data back for AAWFIP to pick up. There is no
   other write path anywhere in this file — search for
   localStorage.setItem/removeItem to see the single call site.

   Design tokens below are copied from AAWFIP's own :root block
   (same palette, type, and general visual language) so the two
   applications read as part of the same product family, per this
   stage's brief to reuse AAWFIP's existing design language.

   Scope of this stage, deliberately: load the Strategic Database
   and validate that what was loaded actually looks like one —
   nothing more. No analytics, scoring, cross-referencing, or
   ecosystem-mapping features live here yet.
   ================================================================ */
:root {
  --ink-deep:      #06141F;
  --ink-mid:       #0B2136;
  --ink-panel:     #102A40;
  --line:          #1D3E56;
  --teal:          #1F8A8C;
  --teal-bright:   #35B4B0;
  --seafoam:       #8FE3D3;
  --coral:         #E8734A;
  --text-hi:       #EAF3F3;
  --text-mid:      #A9C2C6;
  --text-lo:       #79939A;
  --font-display:  'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Georgia, serif;
  --font-body:     -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono:     'SF Mono', 'Cascadia Code', Consolas, 'Courier New', monospace;
  --radius:        3px;
  --shadow:        0 8px 24px rgba(2,10,16,0.35);
  --transition:    180ms ease;

  /* Ecosystem Mapping node colours \u2014 chosen to stay within the same
     dark, desaturated palette as the rest of the app while still
     giving each of the seven entity kinds a distinct hue. */
  --eco-project:      #8FE3D3;
  --eco-organisation: #35B4B0;
  --eco-university:   #6F9FD8;
  --eco-ngo:           #D2B24C;
  --eco-government:   #A487D9;
  --eco-funder:        #E8734A;
  --eco-researcher:    #EAF3F3;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--ink-deep);
  color: var(--text-hi);
  font-family: var(--font-body);
}

body { min-height: 100vh; }

a { color: inherit; text-decoration: none; }

::selection { background: var(--teal); color: var(--ink-deep); }

:focus-visible {
  outline: 2px solid var(--seafoam);
  outline-offset: 2px;
}

/* ---------- Header ---------- */
.header {
  border-bottom: 1px solid var(--line);
  background: var(--ink-mid);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 14px;
}

/* ---------- Backup (export / import) controls ---------- */
.backup-controls { display: flex; align-items: center; gap: 8px; }
.backup-btn {
  background: var(--ink-panel);
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-body);
  font-size: 0.78rem;
  font-weight: 500;
  border-radius: var(--radius);
  padding: 7px 13px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 7px;
  transition: border-color var(--transition), color var(--transition);
}
.backup-btn:hover:not(:disabled) { border-color: var(--teal-bright); color: var(--text-hi); }
.backup-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.backup-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
.backup-btn.busy svg { animation: spin 0.9s linear infinite; }
.backup-status {
  font-size: 0.72rem;
  font-family: var(--font-mono);
  color: var(--text-lo);
  max-width: 220px;
}
.backup-status.ok { color: var(--seafoam); }
.backup-status.err { color: var(--coral); }

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  font-family: var(--font-display);
  font-size: 1.15rem;
  letter-spacing: 0.01em;
}

.brand-mark { width: 30px; height: 30px; flex-shrink: 0; }

.brand-sub {
  font-family: var(--font-body);
  font-size: 0.68rem;
  color: var(--text-lo);
  text-transform: uppercase;
  letter-spacing: 0.14em;
  border-left: 1px solid var(--line);
  padding-left: 12px;
  margin-left: 2px;
}

/* ---------- Main shell ---------- */
.main {
  max-width: 760px;
  margin: 0 auto;
  padding: 48px 28px 60px;
}

.page-heading { margin-bottom: 28px; }
.page-heading h1 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.5rem;
  margin-bottom: 6px;
}
.page-heading .meta {
  font-size: 0.82rem;
  color: var(--text-lo);
  font-family: var(--font-mono);
}

/* ---------- Panel (shared shell for every state) ---------- */
.panel {
  background: var(--ink-mid);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 32px;
  box-shadow: var(--shadow);
}

/* ---------- Loading state ---------- */
@keyframes spin { to { transform: rotate(360deg); } }
.loading-state { text-align: center; padding: 52px 24px; }
.spinner {
  width: 30px; height: 30px;
  margin: 0 auto 18px;
  border-radius: 50%;
  border: 2.5px solid var(--line);
  border-top-color: var(--teal-bright);
  animation: spin 0.75s linear infinite;
}
.spinner.small { width: 14px; height: 14px; border-width: 2px; margin: 0; }
.loading-state p {
  color: var(--text-mid);
  font-size: 0.9rem;
  font-family: var(--font-mono);
}

/* ---------- Confirm-restore modal ---------- */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(2,10,16,0.6);
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  z-index: 100;
}
.modal {
  background: var(--ink-mid);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  max-width: 460px;
  width: 100%;
  padding: 26px 28px;
}
.modal h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.15rem;
  margin-bottom: 10px;
}
.modal p { font-size: 0.86rem; color: var(--text-mid); line-height: 1.6; margin-bottom: 10px; }
.modal-compare {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin: 14px 0 18px;
}
.modal-compare .col { background: var(--ink-deep); padding: 12px 14px; }
.modal-compare .col h4 {
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-lo);
  margin-bottom: 8px;
}
.modal-compare .col div { font-size: 0.8rem; color: var(--text-mid); margin-bottom: 3px; }
.modal-warning {
  font-size: 0.8rem;
  color: var(--coral);
  background: rgba(232,115,74,0.09);
  border: 1px solid var(--coral);
  border-radius: var(--radius);
  padding: 10px 12px;
  margin-bottom: 18px;
}
.modal-actions { display: flex; justify-content: flex-end; gap: 10px; }
.modal-btn {
  font-family: var(--font-body);
  font-size: 0.84rem;
  font-weight: 600;
  border-radius: var(--radius);
  padding: 9px 16px;
  cursor: pointer;
}
.modal-btn.cancel { background: transparent; border: 1px solid var(--line); color: var(--text-mid); }
.modal-btn.cancel:hover { color: var(--text-hi); border-color: var(--text-lo); }
.modal-btn.confirm { background: var(--coral); border: 1px solid var(--coral); color: var(--ink-deep); }
.modal-btn.confirm:hover { background: #f0855c; }

/* ---------- Empty / not-yet-synced state ---------- */
.empty-state { text-align: center; padding: 40px 24px; }
.empty-state .empty-mark {
  width: 42px; height: 42px;
  margin: 0 auto 18px;
  color: var(--text-lo);
}
.empty-state h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.2rem;
  margin-bottom: 10px;
}
.empty-state p {
  color: var(--text-mid);
  font-size: 0.94rem;
  line-height: 1.65;
  max-width: 440px;
  margin: 0 auto;
}
.empty-state code {
  font-family: var(--font-mono);
  font-size: 0.85em;
  color: var(--seafoam);
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 1px 6px;
}

/* ---------- Invalid-data state ---------- */
.invalid-state .empty-mark { color: var(--coral); }

/* ---------- Validated state ---------- */
.validated-header {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 22px;
}
.validated-badge {
  width: 34px; height: 34px;
  flex-shrink: 0;
  color: var(--seafoam);
}
.validated-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.15rem;
}
.validated-header .sub {
  font-size: 0.8rem;
  color: var(--text-lo);
  margin-top: 2px;
}

.field-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 14px 18px;
  margin-bottom: 26px;
}
.field-cell {
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 12px 14px;
}
.field-cell .num {
  font-family: var(--font-display);
  font-size: 1.15rem;
  color: var(--seafoam);
}
.field-cell .label {
  margin-top: 4px;
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-lo);
}

.section-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-lo);
  margin-bottom: 10px;
}

/* ---------- Strategic Dashboard stat strip ---------- */
.dash-heading {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.1rem;
  margin-bottom: 14px;
}
.dash-stat-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 30px;
}
.dash-stat-cell {
  background: var(--ink-deep);
  padding: 18px 18px;
}
.dash-stat-cell .num {
  font-family: var(--font-display);
  font-size: 1.65rem;
  color: var(--seafoam);
  line-height: 1;
  word-break: break-word;
}
.dash-stat-cell .label {
  margin-top: 7px;
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-lo);
}

.check-list {
  list-style: none;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 8px 18px;
}
.check-list li {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.86rem;
  color: var(--text-mid);
}
.check-icon { flex-shrink: 0; width: 15px; height: 15px; }
.check-list li.present .check-icon { color: var(--seafoam); }
.check-list li.missing .check-icon { color: var(--text-lo); }
.check-list li.missing { color: var(--text-lo); }

.status-note {
  margin-top: 24px;
  font-size: 0.76rem;
  color: var(--text-lo);
  font-family: var(--font-mono);
}

/* ---------- Data Integrity & Synchronisation ---------- */
.integrity-banner {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  margin-bottom: 18px;
  font-size: 0.88rem;
  color: var(--text-hi);
}
.integrity-banner.ok { border-color: var(--teal); background: rgba(31,138,140,0.09); }
.integrity-banner.warn { border-color: var(--coral); background: rgba(232,115,74,0.09); }
.integrity-pill {
  display: inline-block;
  flex-shrink: 0;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
}
.integrity-pill.ok   { background: rgba(143,227,211,0.16); color: var(--seafoam); }
.integrity-pill.warn { background: rgba(232,115,74,0.18);  color: var(--coral); }
.integrity-pill.fail { background: rgba(232,115,74,0.30);  color: var(--coral); }
.integrity-row {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 0.86rem;
  color: var(--text-mid);
  padding: 6px 0;
  border-bottom: 1px solid var(--line);
}
.integrity-row:last-child { border-bottom: none; }
.integrity-row .integrity-label { flex: 1; }
.integrity-row .integrity-detail { color: var(--text-lo); font-size: 0.78rem; }

/* ---------- Global Search ---------- */
.search-section { margin-bottom: 28px; }
.search-input {
  width: 100%;
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-hi);
  font-family: var(--font-body);
  font-size: 0.94rem;
  padding: 11px 14px;
  transition: border-color var(--transition);
}
.search-input::placeholder { color: var(--text-lo); }
.search-input:focus {
  border-color: var(--teal-bright);
  outline: none;
}
.search-results { margin-top: 14px; }
.search-hint {
  font-size: 0.86rem;
  color: var(--text-lo);
  padding: 6px 2px;
}
.search-group { margin-bottom: 18px; }
.search-group:last-child { margin-bottom: 0; }
.search-group-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--teal-bright);
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.search-group-count {
  font-family: var(--font-mono);
  color: var(--text-lo);
  letter-spacing: 0;
  text-transform: none;
  font-size: 0.72rem;
}
.search-group-items {
  display: flex;
  flex-direction: column;
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.search-result {
  background: var(--ink-deep);
  padding: 10px 14px;
}
.search-result-title {
  font-size: 0.9rem;
  color: var(--text-hi);
}
.search-result-subtitle {
  margin-top: 2px;
  font-size: 0.74rem;
  color: var(--text-lo);
}
.search-result-snippet {
  margin-top: 4px;
  font-size: 0.8rem;
  color: var(--text-mid);
  line-height: 1.5;
}
.search-more {
  background: var(--ink-deep);
  padding: 8px 14px;
  font-size: 0.76rem;
  color: var(--text-lo);
  font-family: var(--font-mono);
}
mark {
  background: var(--teal);
  color: var(--ink-deep);
  border-radius: 2px;
  padding: 0 2px;
}

/* ---------- Filter chips (Global Search + Project Intelligence) ---------- */
.filter-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  margin-top: 10px;
}
.filter-chip {
  background: var(--ink-deep);
  border: 1px solid var(--line);
  color: var(--text-mid);
  font-family: var(--font-body);
  font-size: 0.76rem;
  border-radius: 999px;
  padding: 5px 13px;
  cursor: pointer;
  transition: border-color var(--transition), color var(--transition), background var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.filter-chip:hover { border-color: var(--teal-bright); color: var(--text-hi); }
.filter-chip.active {
  background: rgba(143,227,211,0.14);
  border-color: var(--teal-bright);
  color: var(--seafoam);
}
.filter-chip .filter-chip-count {
  font-family: var(--font-mono);
  color: var(--text-lo);
  font-size: 0.7rem;
}
.filter-chip.active .filter-chip-count { color: var(--seafoam); }

/* ---------- Project Intelligence ---------- */
.project-intel { margin-top: 14px; }
.project-card {
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px 22px;
  margin-bottom: 16px;
}
.project-card:last-child { margin-bottom: 0; }
.project-card-header {
  display: flex;
  align-items: baseline;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}
.project-card-header h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.08rem;
}
.project-status-pill {
  font-size: 0.66rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--seafoam);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 2px 10px;
}
.intel-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 18px 22px;
}
.intel-block .label {
  font-size: 0.7rem;
  text-transform: uppercase;
  letter-spacing: 0.09em;
  color: var(--text-lo);
  margin-bottom: 8px;
}
.intel-block ul { list-style: none; }
.intel-block li {
  font-size: 0.84rem;
  color: var(--text-mid);
  line-height: 1.55;
  padding-left: 13px;
  position: relative;
  margin-bottom: 5px;
}
.intel-block li::before {
  content: '\2013';
  position: absolute;
  left: 0;
  color: var(--text-lo);
}
.intel-block .empty-note {
  font-size: 0.82rem;
  color: var(--text-lo);
  font-style: italic;
}
.intel-block.risks li { color: var(--coral); }
.intel-block.risks li::before { color: var(--coral); }
.intel-block.strengths li { color: var(--seafoam); }
.intel-block.strengths li::before { color: var(--seafoam); }
.intel-block.missing li { color: var(--text-lo); }
.overview-fields {
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 0.84rem;
  color: var(--text-mid);
  margin-bottom: 8px;
}
.overview-fields .row { display: flex; gap: 8px; }
.overview-fields .row .k {
  color: var(--text-lo);
  min-width: 72px;
  flex-shrink: 0;
}
.overview-fields .row .v em, .intel-block p em { color: var(--text-lo); font-style: italic; }
.intel-block p { font-size: 0.84rem; color: var(--text-mid); line-height: 1.55; }

/* ---------- Ecosystem Mapping ---------- */
.ecosystem-mapping { margin-top: 14px; }
.eco-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 14px;
  margin-bottom: 14px;
}
.eco-search { max-width: 260px; flex-shrink: 0; }
.eco-legend {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 16px;
  flex: 1;
}
.eco-legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 0.78rem;
  color: var(--text-mid);
  cursor: pointer;
  user-select: none;
}
.eco-legend-item input { accent-color: var(--teal-bright); }
.eco-dot {
  width: 9px; height: 9px;
  border-radius: 50%;
  flex-shrink: 0;
  display: inline-block;
}
.eco-legend-count {
  color: var(--text-lo);
  font-family: var(--font-mono);
  font-size: 0.7rem;
}
.eco-graph-wrap {
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  position: relative;
}
.eco-svg {
  width: 100%;
  height: 560px;
  display: block;
  cursor: grab;
}
.eco-svg:active { cursor: grabbing; }
.eco-hint {
  position: absolute;
  left: 12px;
  bottom: 10px;
  font-size: 0.68rem;
  font-family: var(--font-mono);
  color: var(--text-lo);
  background: rgba(6,20,31,0.72);
  padding: 3px 8px;
  border-radius: var(--radius);
  pointer-events: none;
}
.eco-edge {
  stroke: var(--line);
  stroke-width: 1;
  transition: stroke var(--transition), opacity var(--transition);
}
.eco-edge-active { stroke: var(--teal-bright); stroke-width: 1.6; }
.eco-node circle {
  stroke: var(--ink-deep);
  stroke-width: 1.5;
  transition: opacity var(--transition), stroke var(--transition);
}
.eco-node { cursor: pointer; }
.eco-node:hover circle { stroke: var(--seafoam); }
.eco-label {
  font-family: var(--font-mono);
  font-size: 8.5px;
  fill: var(--text-mid);
  pointer-events: none;
}
.eco-dim { opacity: 0.14; }
.eco-detail:empty { display: none; }

/* ---------- Strategic Opportunity Detection ---------- */
.opportunity-detection { margin-top: 14px; }

/* ---------- Timeline Intelligence ---------- */
.timeline-intelligence { margin-top: 14px; }

/* ---------- Strategic Reports ---------- */
.strategic-reports { margin-top: 14px; }
.reports-toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-bottom: 18px;
}
.report-select {
  background: var(--ink-deep);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--text-hi);
  font-family: var(--font-body);
  font-size: 0.88rem;
  padding: 9px 12px;
  min-width: 220px;
}
.report-select:focus-visible { outline: 2px solid var(--seafoam); outline-offset: 1px; }
.report-export-btn {
  background: var(--teal);
  border: 1px solid var(--teal-bright);
  color: var(--ink-deep);
  font-family: var(--font-body);
  font-weight: 600;
  font-size: 0.84rem;
  border-radius: var(--radius);
  padding: 9px 16px;
  cursor: pointer;
  transition: background var(--transition);
}
.report-export-btn:hover { background: var(--teal-bright); }
.report-meta {
  font-size: 0.76rem;
  color: var(--text-lo);
  font-family: var(--font-mono);
  margin-left: auto;
}
.report-doc { padding: 30px 32px; }
.report-doc-header {
  margin-bottom: 22px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.report-doc-header h2 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.3rem;
  margin-bottom: 6px;
}
.report-doc-header .report-sub {
  font-size: 0.8rem;
  color: var(--text-lo);
  font-family: var(--font-mono);
}
.report-section { margin-bottom: 26px; }
.report-section:last-child { margin-bottom: 0; }
.report-section h3 {
  font-family: var(--font-display);
  font-weight: 500;
  font-size: 1.02rem;
  margin-bottom: 12px;
  color: var(--seafoam);
}
.report-table { width: 100%; border-collapse: collapse; font-size: 0.84rem; }
.report-table th, .report-table td {
  text-align: left;
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
}
.report-table th {
  color: var(--text-lo);
  text-transform: uppercase;
  font-size: 0.68rem;
  letter-spacing: 0.08em;
  font-weight: 500;
}
.report-table td { color: var(--text-mid); }
.report-list { list-style: none; }
.report-list li {
  font-size: 0.84rem;
  color: var(--text-mid);
  line-height: 1.6;
  padding-left: 13px;
  position: relative;
  margin-bottom: 6px;
}
.report-list li::before { content: '\2013'; position: absolute; left: 0; color: var(--text-lo); }
.report-empty { font-size: 0.84rem; color: var(--text-lo); font-style: italic; }
.report-summary-strip {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 1px;
  background: var(--line);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  margin-bottom: 26px;
}
.report-summary-cell { background: var(--ink-deep); padding: 14px 16px; }
.report-summary-cell .num {
  font-family: var(--font-display);
  font-size: 1.3rem;
  color: var(--seafoam);
  line-height: 1;
}
.report-summary-cell .label {
  margin-top: 6px;
  font-size: 0.68rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-lo);
}

@media print {
  @page {
    margin: 1.6cm 1.4cm 1.8cm;
    @bottom-right { content: 'Page ' counter(page) ' of ' counter(pages); font-size: 8pt; color: #79939A; }
    @bottom-left { content: 'SIE \u2014 Strategic Intelligence Engine'; font-size: 8pt; color: #79939A; }
  }
  body * { visibility: hidden; }
  #reportPrintArea, #reportPrintArea * { visibility: visible; }
  #reportPrintArea {
    position: absolute; left: 0; top: 0; width: 100%; margin: 0; padding: 0;
    border: none; box-shadow: none;
  }
  html, body { background: #ffffff; }
  #reportPrintArea, #reportPrintArea * {
    background: #ffffff !important;
    color: #10202a !important;
    border-color: #c9d6d6 !important;
    box-shadow: none !important;
  }
  #reportPrintArea h2, #reportPrintArea h3 { color: #0b2136 !important; }
  #reportPrintArea .report-summary-cell .num { color: #1f8a8c !important; }
  #reportPrintArea .report-doc { padding: 0; }

  /* Keep summary cells, table rows, list items and section headings
     from splitting awkwardly across a page boundary. */
  #reportPrintArea .report-section { break-inside: avoid-page; page-break-inside: avoid; }
  #reportPrintArea .report-doc-header { break-after: avoid-page; page-break-after: avoid; }
  #reportPrintArea .report-section h3 { break-after: avoid-page; page-break-after: avoid; }
  #reportPrintArea .report-table tr { break-inside: avoid-page; page-break-inside: avoid; }
  #reportPrintArea .report-table thead { display: table-header-group; }
  #reportPrintArea .report-list li { break-inside: avoid-page; page-break-inside: avoid; }
  #reportPrintArea .report-summary-strip { break-inside: avoid-page; page-break-inside: avoid; }

  /* A long table/list section is still allowed to start a fresh page
     rather than leaving a single orphaned row/heading at the bottom
     of the previous one. */
  #reportPrintArea .report-section h3 { orphans: 3; widows: 3; }
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 32 32" fill="none">
      <path d="M2 22c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 6 3" stroke="#35B4B0" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M2 16c3 0 3-3 6-3s3 3 6 3 3-3 6-3 3 3 6 3" stroke="#8FE3D3" stroke-width="1.6" stroke-linecap="round" opacity="0.6"/>
      <circle cx="16" cy="9" r="3.4" stroke="#EAF3F3" stroke-width="1.4"/>
    </svg>
    <span>SIE</span>
    <span class="brand-sub">Strategic Intelligence Engine</span>
  </div>
  <div class="backup-controls" id="backupControls">
    <!-- populated by script below -->
  </div>
</header>

<main class="main">
  <div class="page-heading">
    <h1>Strategic Intelligence Engine</h1>
    <div class="meta" id="pageMeta">Loading AAWFIP_StrategicDatabase&hellip;</div>
  </div>

  <div class="panel" id="panel">
    <div class="loading-state">
      <div class="spinner"></div>
      <p>Loading AAWFIP_StrategicDatabase&hellip;</p>
    </div>
  </div>
</main>

<div id="modalMount"><!-- confirm-restore modal, populated by script below --></div>

<script>
(function () {
  'use strict';

  // The only thing SIE shares with AAWFIP: the localStorage key its
  // sync button writes to. This module never loads or references any
  // AAWFIP file, script, or global. It reads this key on every load,
  // and writes to it in exactly one place — setItem inside
  // performRestoreFromBackup, run only after a person has picked a
  // backup file via Backup > Import and explicitly confirmed the
  // restore dialog. There is no other setItem/removeItem call on this
  // or any other key anywhere in this file.
  var STRATEGIC_DB_STORAGE_KEY = 'AAWFIP_StrategicDatabase';

  // The top-level sections a well-formed Strategic Database is
  // expected to have (matching the schema AAWFIP's own sync module
  // builds/upgrades). Used only to validate what was loaded — this
  // list is never written back anywhere.
  var EXPECTED_COLLECTIONS = [
    'metadata', 'organisations', 'funders', 'fundingSchemes',
    'contacts', 'changeLog', 'projects', 'applicantCompetitiveness',
    'competitors', 'researchers', 'publications', 'relationships'
  ];

  /**
   * loadResult
   * ---------------------------------------------------------------
   * Read-only, defensive load + validation of AAWFIP_StrategicDatabase.
   * Never throws. Returns one of:
   *   { state: 'missing' }                     — key not present at all
   *   { state: 'invalid', reason: string }      — present but not usable
   *   { state: 'valid', db: object }            — parsed successfully
   */
  function loadResult() {
    var raw = null;
    try {
      raw = window.localStorage.getItem(STRATEGIC_DB_STORAGE_KEY);
    } catch (e) {
      return { state: 'invalid', reason: 'Local storage could not be read in this browser (' + (e && e.message ? e.message : 'unknown error') + ').' };
    }

    if (raw === null) {
      return { state: 'missing' };
    }

    var parsed;
    try {
      parsed = JSON.parse(raw);
    } catch (e) {
      return { state: 'invalid', reason: 'The stored value is not valid JSON, so it could not be parsed.' };
    }

    if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
      return { state: 'invalid', reason: 'The stored value is not a Strategic Database object.' };
    }

    return { state: 'valid', db: parsed };
  }

  function escapeHtml(str) {
    return String(str == null ? '' : str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function formatDate(iso) {
    if (!iso) return 'Never';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return 'Unknown';
    return d.toLocaleString(undefined, {
      year: 'numeric', month: 'short', day: 'numeric',
      hour: '2-digit', minute: '2-digit'
    });
  }

  function countOf(list) {
    return Array.isArray(list) ? list.length : 0;
  }

  /**
   * countUploadedDocuments
   * ---------------------------------------------------------------
   * Sums the length of each project's own `uploadedDocuments` array
   * (a field already present on every project record — see AAWFIP's
   * pjNormalizeProject). Nothing is invented: a project with no
   * uploads, or a malformed/missing field, simply contributes 0.
   */
  function countUploadedDocuments(projects) {
    if (!Array.isArray(projects)) return 0;
    var total = 0;
    projects.forEach(function (p) {
      if (p && Array.isArray(p.uploadedDocuments)) total += p.uploadedDocuments.length;
    });
    return total;
  }

  // =================================================================
  // Global Search
  // -----------------------------------------------------------------
  // Read-only, in-memory index built once from the already-loaded
  // Strategic Database. Searches Projects, Organisations, Funders,
  // Documents (each project's own uploadedDocuments array), and Notes
  // (a top-level db.notes collection if one exists, plus any .notes
  // field already attached to a project/organisation/funder record).
  // Every field read here already exists on the record \u2014 nothing is
  // invented, estimated, or written back anywhere.
  // =================================================================

  var SEARCH_CATEGORY_ORDER = ['Projects', 'Organisations', 'Funders', 'Documents', 'Notes'];
  var SEARCH_MAX_PER_CATEGORY = 8;
  var SEARCH_MIN_QUERY_LENGTH = 2;

  function getField(obj, candidates) {
    if (!obj || typeof obj !== 'object') return '';
    for (var i = 0; i < candidates.length; i++) {
      var v = obj[candidates[i]];
      if (typeof v === 'string' && v.trim() !== '') return v.trim();
    }
    return '';
  }

  function escapeRegExp(str) {
    return String(str).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function truncateAround(text, query, radius) {
    text = String(text == null ? '' : text);
    radius = radius || 60;
    if (!query) {
      return text.length > radius * 2 ? text.slice(0, radius * 2).trim() + '\u2026' : text;
    }
    var idx = text.toLowerCase().indexOf(query.toLowerCase());
    if (idx === -1) {
      return text.length > radius * 2 ? text.slice(0, radius * 2).trim() + '\u2026' : text;
    }
    var start = Math.max(0, idx - radius);
    var end = Math.min(text.length, idx + query.length + radius);
    var snippet = text.slice(start, end).trim();
    return (start > 0 ? '\u2026' : '') + snippet + (end < text.length ? '\u2026' : '');
  }

  function highlight(text, query) {
    var escaped = escapeHtml(text);
    if (!query) return escaped;
    var re = new RegExp('(' + escapeRegExp(escapeHtml(query)) + ')', 'ig');
    return escaped.replace(re, '<mark>$1</mark>');
  }

  /**
   * buildSearchIndex
   * ---------------------------------------------------------------
   * Flattens the validated database into a single array of
   * { category, title, subtitle, body, searchText } records, one per
   * searchable item. Read-only: nothing here mutates db.
   */
  function buildSearchIndex(db) {
    var records = [];

    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var subtitle = getField(p, ['status', 'stage', 'phase']);
      var body = getField(p, ['description', 'summary', 'overview', 'details']);
      records.push({
        category: 'Projects', title: title, subtitle: subtitle, body: body,
        searchText: [title, subtitle, body].join(' ').toLowerCase()
      });
    });

    (Array.isArray(db.organisations) ? db.organisations : []).forEach(function (o) {
      var title = getField(o, ['name', 'organisationName', 'orgName']) || 'Untitled organisation';
      var subtitle = getField(o, ['type', 'sector', 'country', 'location']);
      var body = getField(o, ['description', 'summary']);
      records.push({
        category: 'Organisations', title: title, subtitle: subtitle, body: body,
        searchText: [title, subtitle, body].join(' ').toLowerCase()
      });
    });

    (Array.isArray(db.funders) ? db.funders : []).forEach(function (f) {
      var title = getField(f, ['name', 'funderName']) || 'Untitled funder';
      var subtitle = getField(f, ['type', 'sector', 'country', 'region']);
      var body = getField(f, ['description', 'summary']);
      records.push({
        category: 'Funders', title: title, subtitle: subtitle, body: body,
        searchText: [title, subtitle, body].join(' ').toLowerCase()
      });
    });

    // Documents \u2014 the same uploadedDocuments field countUploadedDocuments
    // already reads, attributed back to its parent project.
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var projectTitle = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      if (!Array.isArray(p.uploadedDocuments)) return;
      p.uploadedDocuments.forEach(function (d) {
        var title = getField(d, ['name', 'fileName', 'title', 'filename']) || 'Untitled document';
        var body = getField(d, ['description', 'summary']);
        records.push({
          category: 'Documents', title: title, subtitle: 'From ' + projectTitle, body: body,
          searchText: [title, projectTitle, body].join(' ').toLowerCase()
        });
      });
    });

    // Notes \u2014 a top-level db.notes collection (if AAWFIP has synced one)
    // plus any .notes field already attached to a project, organisation,
    // or funder record (either an array of note strings/objects, or a
    // single note string).
    function pushOneNote(note, parentLabel) {
      var title, body;
      if (typeof note === 'string') {
        if (note.trim() === '') return;
        title = truncateAround(note, '', 40);
        body = note;
      } else if (note && typeof note === 'object') {
        body = getField(note, ['content', 'text', 'body']);
        title = getField(note, ['title', 'subject']) || (body ? truncateAround(body, '', 40) : '');
        if (!title) return;
      } else {
        return;
      }
      records.push({
        category: 'Notes', title: title, subtitle: parentLabel ? 'On ' + parentLabel : '', body: body,
        searchText: [title, body, parentLabel].join(' ').toLowerCase()
      });
    }

    function pushNotesFrom(list, parentLabelFn) {
      (Array.isArray(list) ? list : []).forEach(function (parent) {
        var parentLabel = parentLabelFn(parent);
        var n = parent && parent.notes;
        if (Array.isArray(n)) {
          n.forEach(function (note) { pushOneNote(note, parentLabel); });
        } else if (typeof n === 'string') {
          pushOneNote(n, parentLabel);
        }
      });
    }

    if (Array.isArray(db.notes)) {
      db.notes.forEach(function (note) { pushOneNote(note, ''); });
    }
    pushNotesFrom(db.projects, function (p) { return getField(p, ['name', 'title', 'projectName', 'projectTitle']); });
    pushNotesFrom(db.organisations, function (o) { return getField(o, ['name', 'organisationName', 'orgName']); });
    pushNotesFrom(db.funders, function (f) { return getField(f, ['name', 'funderName']); });

    return records;
  }

  /**
   * runSearch
   * ---------------------------------------------------------------
   * Case-insensitive substring match against each record's combined
   * searchText. category restricts matching to a single search
   * category ('All' or omitted searches every category). Returns
   * null if no category filter is active and the query is below the
   * minimum length; otherwise an object keyed by category with
   * matches (title matches sorted first). When a specific category
   * filter is active, an empty query is allowed through so the chip
   * can be used to simply browse everything in that category.
   */
  function runSearch(index, query, category) {
    var cat = category || 'All';
    var q = query.trim().toLowerCase();
    if (cat === 'All' && q.length < SEARCH_MIN_QUERY_LENGTH) return null;

    var grouped = {};
    SEARCH_CATEGORY_ORDER.forEach(function (c) { grouped[c] = []; });

    index.forEach(function (rec) {
      if (cat !== 'All' && rec.category !== cat) return;
      if (rec.searchText.indexOf(q) === -1) return;
      grouped[rec.category].push({ rec: rec, titleMatch: rec.title.toLowerCase().indexOf(q) !== -1 });
    });

    SEARCH_CATEGORY_ORDER.forEach(function (c) {
      grouped[c].sort(function (a, b) { return (b.titleMatch ? 1 : 0) - (a.titleMatch ? 1 : 0); });
    });

    return grouped;
  }

  function renderSearchResults(grouped, query, category) {
    var container = document.getElementById('globalSearchResults');
    if (!container) return;
    var cat = category || 'All';

    if (!grouped) {
      container.innerHTML = '<div class="search-hint">Type at least ' + SEARCH_MIN_QUERY_LENGTH +
        ' characters to search Projects, Organisations, Funders, Documents, and Notes \u2014 or pick a filter above to browse one category.</div>';
      return;
    }

    var total = 0;
    SEARCH_CATEGORY_ORDER.forEach(function (c) { total += grouped[c].length; });

    if (total === 0) {
      container.innerHTML = query.trim() === ''
        ? '<div class="search-hint">No ' + escapeHtml(cat.toLowerCase()) + ' recorded in the Strategic Database yet.</div>'
        : '<div class="search-hint">No matches for \u201c' + escapeHtml(query) + '\u201d' + (cat !== 'All' ? ' in ' + escapeHtml(cat.toLowerCase()) : '') + '.</div>';
      return;
    }

    var html = '';
    SEARCH_CATEGORY_ORDER.forEach(function (c) {
      var items = grouped[c];
      if (!items.length) return;
      html += '<div class="search-group">' +
        '<div class="search-group-label">' + escapeHtml(c) + ' <span class="search-group-count">' + items.length + '</span></div>' +
        '<div class="search-group-items">';
      items.slice(0, SEARCH_MAX_PER_CATEGORY).forEach(function (item) {
        var rec = item.rec;
        var snippetSource = item.titleMatch ? (rec.body || rec.subtitle || '') : (rec.body || rec.subtitle || '');
        var snippet = snippetSource ? truncateAround(snippetSource, query, 55) : '';
        html += '<div class="search-result">' +
          '<div class="search-result-title">' + highlight(rec.title, query) + '</div>' +
          (rec.subtitle ? '<div class="search-result-subtitle">' + escapeHtml(rec.subtitle) + '</div>' : '') +
          (snippet ? '<div class="search-result-snippet">' + highlight(snippet, query) + '</div>' : '') +
          '</div>';
      });
      if (items.length > SEARCH_MAX_PER_CATEGORY) {
        html += '<div class="search-more">+' + (items.length - SEARCH_MAX_PER_CATEGORY) + ' more not shown</div>';
      }
      html += '</div></div>';
    });

    container.innerHTML = html;
  }

  // =================================================================
  // Project Intelligence
  // -----------------------------------------------------------------
  // Per-project rollup: Overview, Funding opportunities, Collaborators,
  // Risks, Strengths, Weaknesses, Missing information. Every field read
  // here already exists on a record somewhere in the Strategic Database
  // (the project itself, db.funders, db.fundingSchemes, db.organisations,
  // or db.relationships) \u2014 nothing is invented. Risks/Strengths/
  // Weaknesses are explicit, fixed rules evaluated against those real
  // fields (documented inline below), not free-form generated text.
  // Missing information is a literal audit of which core overview
  // fields on the project's own record are blank.
  // =================================================================

  function getListField(obj, candidates) {
    if (!obj || typeof obj !== 'object') return [];
    for (var i = 0; i < candidates.length; i++) {
      var v = obj[candidates[i]];
      if (Array.isArray(v) && v.length) return v;
    }
    return [];
  }

  function uniqueStrings(arr) {
    var seen = {};
    var out = [];
    arr.forEach(function (s) {
      if (typeof s !== 'string') return;
      var t = s.trim();
      if (!t) return;
      var key = t.toLowerCase();
      if (seen[key]) return;
      seen[key] = true;
      out.push(t);
    });
    return out;
  }

  // findByIdOrName is called from many places (relationship resolution,
  // funder/collaborator name lookups, the ecosystem graph, project
  // similarity pairing) — often once per project/organisation/relationship,
  // which made the original linear scan an O(n) cost repeated O(n) times
  // (effectively O(n^2)-O(n^3) once nested) on large Strategic Databases.
  // ID_INDEX_CACHE keys each index by the *array reference itself*, so it
  // stays correct across re-syncs for free: AAWFIP's sync always produces
  // a brand-new parsed array, so a fresh sync naturally gets a fresh
  // index rather than a stale one.
  var ID_INDEX_CACHE = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;
  var ID_INDEX_FIELDS = ['id', '_id', 'name', 'funderName', 'organisationName'];

  function buildIdIndex(list) {
    var map = new Map();
    for (var i = 0; i < list.length; i++) {
      var item = list[i];
      if (!item || typeof item !== 'object') continue;
      for (var j = 0; j < ID_INDEX_FIELDS.length; j++) {
        var v = item[ID_INDEX_FIELDS[j]];
        // First item in list order to claim a given key wins \u2014 matches
        // the original scan's behaviour exactly (earliest item, any field).
        if (v !== undefined && v !== null && !map.has(v)) map.set(v, item);
      }
    }
    return map;
  }

  function findByIdOrName(list, key) {
    if (!Array.isArray(list) || key == null) return null;
    if (!ID_INDEX_CACHE || typeof Map === 'undefined') {
      // Fallback for environments without WeakMap/Map: original linear scan.
      for (var i = 0; i < list.length; i++) {
        var item = list[i];
        if (!item || typeof item !== 'object') continue;
        if (item.id === key || item._id === key || item.name === key ||
            item.funderName === key || item.organisationName === key) return item;
      }
      return null;
    }
    var idx = ID_INDEX_CACHE.get(list);
    if (!idx) {
      idx = buildIdIndex(list);
      ID_INDEX_CACHE.set(list, idx);
    }
    return idx.get(key) || null;
  }

  function resolveFunderName(entry, db) {
    if (typeof entry === 'string') {
      var match = findByIdOrName(db.funders, entry) || findByIdOrName(db.fundingSchemes, entry);
      return match ? (getField(match, ['name', 'funderName']) || entry) : entry;
    }
    if (entry && typeof entry === 'object') {
      var direct = getField(entry, ['name', 'funderName', 'fundingSchemeName']);
      if (direct) return direct;
      if (entry.funderId != null) return resolveFunderName(entry.funderId, db);
      if (entry.id != null) return resolveFunderName(entry.id, db);
    }
    return null;
  }

  function resolveCollaboratorName(entry, db) {
    if (typeof entry === 'string') {
      var match = findByIdOrName(db.organisations, entry);
      return match ? (getField(match, ['name', 'organisationName', 'orgName']) || entry) : entry;
    }
    if (entry && typeof entry === 'object') {
      var direct = getField(entry, ['name', 'organisationName', 'orgName']);
      if (direct) return direct;
      if (entry.organisationId != null) return resolveCollaboratorName(entry.organisationId, db);
      if (entry.id != null) return resolveCollaboratorName(entry.id, db);
    }
    return null;
  }

  /**
   * resolveEntityLabel
   * ---------------------------------------------------------------
   * Best-effort display name for a relationship endpoint that's just
   * an id/string: checks organisations, funders, projects, and
   * researchers (the collections we know exist) and falls back to
   * the raw value if none match.
   */
  function resolveEntityLabel(value, db) {
    if (typeof value !== 'string') return '';
    var collections = [db.organisations, db.funders, db.projects, db.researchers];
    for (var i = 0; i < collections.length; i++) {
      var match = findByIdOrName(collections[i], value);
      if (match) return getField(match, ['name', 'title', 'organisationName', 'orgName', 'funderName', 'projectName']) || value;
    }
    return value;
  }

  /**
   * relationshipsForEntity
   * ---------------------------------------------------------------
   * Reads db.relationships (if present) for entries where either side
   * refers to this entity (by id or by matching its title), returning
   * { type, counterpart } pairs \u2014 the relationship's own type field
   * plus the other side's resolved name. Silently contributes nothing
   * if the collection or the expected fields aren't there.
   *
   * This is called once per project (Project Intelligence) and up to
   * twice per organisation (Organisation Intelligence), so a naive
   * linear scan over db.relationships repeats O(relationships) work
   * O(projects + organisations) times \u2014 effectively O(n^2) on a
   * large Strategic Database. REL_INDEX_CACHE builds one lookup table
   * from db.relationships (keyed by the array reference itself, same
   * approach as ID_INDEX_CACHE) so every relationship is inspected
   * exactly once no matter how many entities query it.
   */
  var REL_INDEX_CACHE = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;

  function relationshipsForEntityLinear(db, entity, entityTitle) {
    var out = [];
    if (!Array.isArray(db.relationships)) return out;
    var entityId = entity.id != null ? entity.id : entity._id;
    db.relationships.forEach(function (rel) {
      if (!rel || typeof rel !== 'object') return;
      var type = getField(rel, ['type', 'relationshipType', 'category']) || 'Relationship';
      var a = rel.source != null ? rel.source : (rel.from != null ? rel.from : rel.sourceId);
      var b = rel.target != null ? rel.target : (rel.to != null ? rel.to : rel.targetId);
      var aName = getField(rel, ['sourceName', 'fromName']) || resolveEntityLabel(a, db);
      var bName = getField(rel, ['targetName', 'toName']) || resolveEntityLabel(b, db);
      var isA = (entityId != null && a === entityId) ||
        (!!aName && aName.toLowerCase() === String(entityTitle).toLowerCase());
      var isB = (entityId != null && b === entityId) ||
        (!!bName && bName.toLowerCase() === String(entityTitle).toLowerCase());
      if (isA && bName) out.push({ type: type, counterpart: bName });
      else if (isB && aName) out.push({ type: type, counterpart: aName });
    });
    return out;
  }

  // Builds a Map from every id/lowercased-name a relationship side is
  // known by \u2192 the list of { relIndex, type, counterpart } entries
  // that side contributes. Side A is only indexed as "isA" and side B
  // only as "isB", mirroring the if/else-if precedence of the original
  // linear scan so a self-referential relationship (a === b) still
  // resolves the same way.
  function buildRelationshipIndex(db) {
    var index = new Map();
    function addTo(key, entry) {
      if (key == null) return;
      var list = index.get(key);
      if (!list) { list = []; index.set(key, list); }
      list.push(entry);
    }
    var rels = Array.isArray(db.relationships) ? db.relationships : [];
    rels.forEach(function (rel, i) {
      if (!rel || typeof rel !== 'object') return;
      var type = getField(rel, ['type', 'relationshipType', 'category']) || 'Relationship';
      var a = rel.source != null ? rel.source : (rel.from != null ? rel.from : rel.sourceId);
      var b = rel.target != null ? rel.target : (rel.to != null ? rel.to : rel.targetId);
      var aName = getField(rel, ['sourceName', 'fromName']) || resolveEntityLabel(a, db);
      var bName = getField(rel, ['targetName', 'toName']) || resolveEntityLabel(b, db);
      if (bName) {
        var entryForA = { relIndex: i, side: 'A', type: type, counterpart: bName };
        if (a != null) addTo(a, entryForA);
        if (aName) addTo(String(aName).toLowerCase(), entryForA);
      }
      if (aName) {
        var entryForB = { relIndex: i, side: 'B', type: type, counterpart: aName };
        if (b != null) addTo(b, entryForB);
        if (bName) addTo(String(bName).toLowerCase(), entryForB);
      }
    });
    return index;
  }

  function relationshipsForEntity(db, entity, entityTitle) {
    var rels = db.relationships;
    if (!Array.isArray(rels) || !rels.length) return [];
    if (!REL_INDEX_CACHE || typeof Map === 'undefined') {
      return relationshipsForEntityLinear(db, entity, entityTitle);
    }
    var idx = REL_INDEX_CACHE.get(rels);
    if (!idx) {
      idx = buildRelationshipIndex(db);
      REL_INDEX_CACHE.set(rels, idx);
    }
    var entityId = entity.id != null ? entity.id : entity._id;
    var matches = [];
    if (entityId != null) {
      var byId = idx.get(entityId);
      if (byId) matches = matches.concat(byId);
    }
    if (entityTitle != null) {
      var byName = idx.get(String(entityTitle).toLowerCase());
      if (byName) matches = matches.concat(byName);
    }
    if (!matches.length) return [];
    // Restore original db.relationships order and drop any entry that
    // matched this entity on both id and name (isA/isB precedence in
    // the linear scan only ever contributes one entry per relationship).
    // A relationship can appear in `matches` via its A-side entry, its
    // B-side entry, or both (e.g. entity matches side A by name and
    // side B by id at once) — when both are present for the same
    // relIndex, the linear scan's "if (isA...) else if (isB...)"
    // always resolves it as an A-side match, so the side-A entry must
    // win here too, regardless of which lookup (id vs name) happened
    // to produce it first.
    matches.sort(function (x, y) { return x.relIndex - y.relIndex; });
    var bestByRel = {};
    matches.forEach(function (m) {
      var existing = bestByRel[m.relIndex];
      if (!existing || (existing.side === 'B' && m.side === 'A')) {
        bestByRel[m.relIndex] = m;
      }
    });
    var relIndices = Object.keys(bestByRel).map(Number).sort(function (x, y) { return x - y; });
    var out = relIndices.map(function (idx) {
      var m = bestByRel[idx];
      return { type: m.type, counterpart: m.counterpart };
    });
    return out;
  }

  /**
   * relationshipCollaborators
   * ---------------------------------------------------------------
   * Thin wrapper over relationshipsForEntity: just the entries whose
   * type looks like a collaboration, returned as plain names.
   */
  function relationshipCollaborators(db, project, projectTitle) {
    return uniqueStrings(
      relationshipsForEntity(db, project, projectTitle)
        .filter(function (r) { return /collab/i.test(r.type); })
        .map(function (r) { return r.counterpart; })
    );
  }

  function buildProjectIntelligence(db) {
    var projects = Array.isArray(db.projects) ? db.projects : [];
    return projects.map(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var status = getField(p, ['status', 'stage', 'phase']);
      var category = getField(p, ['category', 'focusArea', 'theme']);
      var description = getField(p, ['description', 'summary', 'overview', 'details']);
      var budget = getField(p, ['budget', 'fundingRequested', 'fundingTarget', 'budgetAmount']);
      if (!budget && typeof p.budget === 'number') budget = String(p.budget);
      if (!budget && typeof p.fundingRequested === 'number') budget = String(p.fundingRequested);
      if (!budget && typeof p.fundingTarget === 'number') budget = String(p.fundingTarget);
      var timeline = getField(p, ['timeline', 'startDate', 'projectTimeline']);

      var fundingRaw = getListField(p, ['matchedFunders', 'fundingOpportunities', 'targetFunders', 'funders']);
      var fundingNames = uniqueStrings(fundingRaw.map(function (entry) { return resolveFunderName(entry, db); }).filter(Boolean));

      var collaboratorsRaw = getListField(p, ['collaborators', 'partners', 'team', 'collaboratingOrganisations']);
      var collaboratorNames = uniqueStrings(collaboratorsRaw.map(function (entry) { return resolveCollaboratorName(entry, db); }).filter(Boolean));
      collaboratorNames = uniqueStrings(collaboratorNames.concat(relationshipCollaborators(db, p, title)));

      var docCount = Array.isArray(p.uploadedDocuments) ? p.uploadedDocuments.length : 0;

      var risks = [];
      var strengths = [];
      var weaknesses = [];
      var missing = [];

      // Risks: time-sensitive or existential threats to the project.
      if (fundingNames.length === 0) {
        risks.push('No funding opportunities currently matched \u2014 no active funding pathway.');
      }
      var deadlineRaw = getField(p, ['deadline', 'applicationDeadline', 'dueDate']);
      if (deadlineRaw) {
        var dDate = new Date(deadlineRaw);
        if (!isNaN(dDate.getTime()) && dDate.getTime() < Date.now() && !/fund|complete|closed|awarded/i.test(status)) {
          risks.push('Recorded deadline (' + formatDate(deadlineRaw) + ') has passed.');
        }
      }

      // Strengths: healthy counts already present on the record.
      if (fundingNames.length >= 2) {
        strengths.push(fundingNames.length + ' funding opportunities matched \u2014 diversified funding pipeline.');
      }
      if (collaboratorNames.length >= 2) {
        strengths.push(collaboratorNames.length + ' collaborating organisations recorded.');
      }
      if (docCount >= 1) {
        strengths.push(docCount + ' supporting document' + (docCount === 1 ? '' : 's') + ' on file.');
      }

      // Weaknesses: internal shortfalls (not time-sensitive).
      if (fundingNames.length === 1) {
        weaknesses.push('Only one funding opportunity matched \u2014 limited diversification.');
      }
      if (collaboratorNames.length === 0) {
        weaknesses.push('No collaborating organisations recorded.');
      }
      if (docCount === 0) {
        weaknesses.push('No supporting documents uploaded.');
      }

      // Missing information: literal gaps in the project's own overview fields.
      if (!description) missing.push('No description recorded.');
      if (!status) missing.push('No status recorded.');
      if (!budget) missing.push('No budget or funding target recorded.');
      if (!timeline) missing.push('No timeline recorded.');
      if (!category) missing.push('No category or focus area recorded.');

      return {
        title: title, status: status, category: category, description: description,
        budget: budget, timeline: timeline,
        fundingNames: fundingNames, collaboratorNames: collaboratorNames,
        risks: risks, strengths: strengths, weaknesses: weaknesses, missing: missing
      };
    });
  }

  function renderOverviewBlock(pi) {
    var rows = [
      ['Category', pi.category],
      ['Budget', pi.budget],
      ['Timeline', pi.timeline]
    ];
    var rowsHtml = rows.map(function (r) {
      return '<div class="row"><span class="k">' + escapeHtml(r[0]) + '</span><span class="v">' +
        (r[1] ? escapeHtml(r[1]) : '<em>Not recorded</em>') + '</span></div>';
    }).join('');
    var descHtml = pi.description ?
      '<p>' + escapeHtml(truncateAround(pi.description, '', 140)) + '</p>' :
      '<p><em>No description recorded.</em></p>';
    return '<div class="intel-block"><div class="label">Overview</div><div class="overview-fields">' +
      rowsHtml + '</div>' + descHtml + '</div>';
  }

  function renderListBlock(label, items, emptyText, extraClass) {
    var cls = 'intel-block' + (extraClass ? ' ' + extraClass : '') + (items.length ? '' : ' empty');
    var body = items.length ?
      '<ul>' + items.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>' :
      '<div class="empty-note">' + escapeHtml(emptyText) + '</div>';
    return '<div class="' + cls + '"><div class="label">' + escapeHtml(label) + '</div>' + body + '</div>';
  }

  function renderProjectIntelligence(list) {
    if (!list.length) {
      return '<div class="empty-state" style="padding:24px 0;"><p>No projects recorded in the Strategic Database yet.</p></div>';
    }
    return list.map(function (pi) {
      return '<div class="project-card">' +
        '<div class="project-card-header"><h3>' + escapeHtml(pi.title) + '</h3>' +
        (pi.status ? '<span class="project-status-pill">' + escapeHtml(pi.status) + '</span>' : '') +
        '</div>' +
        '<div class="intel-grid">' +
        renderOverviewBlock(pi) +
        renderListBlock('Funding opportunities', pi.fundingNames, 'No funding opportunities recorded for this project yet.') +
        renderListBlock('Collaborators', pi.collaboratorNames, 'No collaborating organisations recorded.') +
        renderListBlock('Risks', pi.risks, 'No risks identified from available data.', 'risks') +
        renderListBlock('Strengths', pi.strengths, 'No strengths identified from available data.', 'strengths') +
        renderListBlock('Weaknesses', pi.weaknesses, 'No weaknesses identified from available data.', 'weaknesses') +
        renderListBlock('Missing information', pi.missing, 'Record is complete across the core fields tracked here.', 'missing') +
        '</div></div>';
    }).join('');
  }

  // =================================================================
  // Organisation Intelligence
  // -----------------------------------------------------------------
  // Per-organisation profile: Relationships, Active projects, Previous
  // funders, Researchers, Partners. Same standard as Project
  // Intelligence \u2014 every value comes from a field that already exists
  // somewhere in the Strategic Database (the organisation's own
  // record, db.relationships, db.projects, db.funders, or
  // db.researchers); nothing is invented.
  // =================================================================

  /**
   * activeProjectsForOrg
   * ---------------------------------------------------------------
   * Projects linked to this organisation \u2014 either directly (the
   * project's own organisation/leadOrganisation field) or as a listed
   * collaborator/partner \u2014 excluding projects whose own status marks
   * them complete/closed/archived. A project with no status at all is
   * treated as active (nothing there says otherwise).
   */
  // activeProjectsForOrg is called once per organisation, and used to
  // rescan every project each time \u2014 O(organisations x projects) on
  // a large Strategic Database. ORG_PROJECT_INDEX_CACHE instead walks
  // db.projects exactly once, filing every non-completed project under
  // every id/name key that could link an org to it (leadOrganisation,
  // collaborators, etc.), so each org lookup afterwards is O(1)-ish
  // (bounded by how many projects actually link to that one org).
  var ORG_PROJECT_INDEX_CACHE = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;

  function buildOrgProjectIndex(db) {
    var index = new Map();
    function addTo(key, entry) {
      if (key == null) return;
      var list = index.get(key);
      if (!list) { list = []; index.set(key, list); }
      list.push(entry);
    }
    var projects = Array.isArray(db.projects) ? db.projects : [];
    projects.forEach(function (p) {
      var status = getField(p, ['status', 'stage', 'phase']);
      if (/complete|closed|finished|archived|cancelled|canceled/i.test(status)) return;
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var entry = { title: title, status: status };
      var seenKeys = {};
      [p.organisation, p.leadOrganisation, p.organisationId, p.orgId].forEach(function (v) {
        if (v == null) return;
        var key = typeof v === 'string' ? v.toLowerCase() : v;
        if (seenKeys[key]) return;
        seenKeys[key] = true;
        addTo(v, entry);
        if (typeof v === 'string') addTo(v.toLowerCase(), entry);
      });
      getListField(p, ['collaborators', 'partners', 'collaboratingOrganisations']).forEach(function (v) {
        if (typeof v === 'string') {
          var key = v.toLowerCase();
          if (!seenKeys[key]) { seenKeys[key] = true; addTo(v, entry); addTo(key, entry); }
          return;
        }
        var name = resolveCollaboratorName(v, db);
        if (name) {
          var nkey = name.toLowerCase();
          if (!seenKeys[nkey]) { seenKeys[nkey] = true; addTo(nkey, entry); }
        }
      });
    });
    return index;
  }

  function activeProjectsForOrg(db, org, orgTitle) {
    var projects = db.projects;
    if (!Array.isArray(projects) || !projects.length) return [];
    if (!ORG_PROJECT_INDEX_CACHE || typeof Map === 'undefined') {
      return activeProjectsForOrgLinear(db, org, orgTitle);
    }
    var idx = ORG_PROJECT_INDEX_CACHE.get(projects);
    if (!idx) { idx = buildOrgProjectIndex(db); ORG_PROJECT_INDEX_CACHE.set(projects, idx); }
    var orgId = org.id != null ? org.id : org._id;
    var seen = new Set();
    var out = [];
    function addAll(list) {
      if (!list) return;
      list.forEach(function (entry) {
        if (seen.has(entry)) return;
        seen.add(entry);
        out.push(entry);
      });
    }
    if (orgId != null) addAll(idx.get(orgId));
    if (orgTitle != null) addAll(idx.get(String(orgTitle).toLowerCase()));
    return out;
  }

  function activeProjectsForOrgLinear(db, org, orgTitle) {
    var orgId = org.id != null ? org.id : org._id;
    var out = [];
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var linked = false;
      [p.organisation, p.leadOrganisation, p.organisationId, p.orgId].forEach(function (v) {
        if (linked || v == null) return;
        if (orgId != null && v === orgId) linked = true;
        else if (typeof v === 'string' && v.toLowerCase() === String(orgTitle).toLowerCase()) linked = true;
      });
      if (!linked) {
        getListField(p, ['collaborators', 'partners', 'collaboratingOrganisations']).forEach(function (entry) {
          if (linked) return;
          if (typeof entry === 'string' && orgId != null && entry === orgId) { linked = true; return; }
          var name = resolveCollaboratorName(entry, db);
          if (name && name.toLowerCase() === String(orgTitle).toLowerCase()) linked = true;
        });
      }
      if (!linked) return;
      var status = getField(p, ['status', 'stage', 'phase']);
      if (/complete|closed|finished|archived|cancelled|canceled/i.test(status)) return;
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      out.push({ title: title, status: status });
    });
    return out;
  }

  function previousFundersForOrg(db, org) {
    var raw = getListField(org, ['previousFunders', 'pastFunders', 'fundingHistory', 'fundersHistory']);
    return uniqueStrings(raw.map(function (entry) { return resolveFunderName(entry, db); }).filter(Boolean));
  }

  /**
   * researchersForOrg
   * ---------------------------------------------------------------
   * Combines the organisation's own researchers field (if any) with
   * any db.researchers record whose own affiliation field points back
   * to this organisation.
   */
  // Same O(organisations x researchers) issue as activeProjectsForOrg,
  // fixed the same way: index db.researchers by affiliation id/name
  // once, then each org does an O(1)-ish lookup.
  var ORG_RESEARCHER_INDEX_CACHE = (typeof WeakMap !== 'undefined') ? new WeakMap() : null;

  function buildOrgResearcherIndex(db) {
    var index = new Map();
    function addTo(key, name) {
      if (key == null || !name) return;
      var list = index.get(key);
      if (!list) { list = []; index.set(key, list); }
      list.push(name);
    }
    (Array.isArray(db.researchers) ? db.researchers : []).forEach(function (r) {
      var aff = r.organisation != null ? r.organisation : (r.organisationId != null ? r.organisationId : r.affiliation);
      if (aff == null) return;
      var name = getField(r, ['name', 'fullName']);
      if (!name) return;
      addTo(aff, name);
      if (typeof aff === 'string') addTo(aff.toLowerCase(), name);
    });
    return index;
  }

  function researchersForOrg(db, org, orgTitle) {
    var orgId = org.id != null ? org.id : org._id;
    var names = [];
    getListField(org, ['researchers', 'affiliatedResearchers']).forEach(function (entry) {
      if (typeof entry === 'string') {
        var match = findByIdOrName(db.researchers, entry);
        names.push(match ? (getField(match, ['name', 'fullName']) || entry) : entry);
      } else if (entry && typeof entry === 'object') {
        var direct = getField(entry, ['name', 'fullName']);
        if (direct) names.push(direct);
      }
    });
    var researchers = db.researchers;
    if (Array.isArray(researchers) && researchers.length) {
      if (!ORG_RESEARCHER_INDEX_CACHE || typeof Map === 'undefined') {
        (researchers).forEach(function (r) {
          var aff = r.organisation != null ? r.organisation : (r.organisationId != null ? r.organisationId : r.affiliation);
          var matches = false;
          if (aff != null) {
            if (orgId != null && aff === orgId) matches = true;
            else if (typeof aff === 'string' && aff.toLowerCase() === String(orgTitle).toLowerCase()) matches = true;
          }
          if (matches) {
            var name = getField(r, ['name', 'fullName']);
            if (name) names.push(name);
          }
        });
      } else {
        var idx = ORG_RESEARCHER_INDEX_CACHE.get(researchers);
        if (!idx) { idx = buildOrgResearcherIndex(db); ORG_RESEARCHER_INDEX_CACHE.set(researchers, idx); }
        if (orgId != null) {
          var byId = idx.get(orgId);
          if (byId) names = names.concat(byId);
        }
        if (orgTitle != null) {
          var byName = idx.get(String(orgTitle).toLowerCase());
          if (byName) names = names.concat(byName);
        }
      }
    }
    return uniqueStrings(names);
  }

  /**
   * partnersForOrg
   * ---------------------------------------------------------------
   * Prefers the organisation's own partners field; if there isn't
   * one, falls back to db.relationships entries tagged Partnership or
   * Collaborator that name another organisation.
   */
  function partnersForOrg(db, org, orgTitle) {
    var direct = uniqueStrings(
      getListField(org, ['partners', 'partnerOrganisations'])
        .map(function (entry) { return resolveCollaboratorName(entry, db); })
        .filter(Boolean)
    );
    if (direct.length) return direct;
    return uniqueStrings(
      relationshipsForEntity(db, org, orgTitle)
        .filter(function (r) { return /partner|collab/i.test(r.type); })
        .map(function (r) { return r.counterpart; })
    );
  }

  function buildOrganisationIntelligence(db) {
    var orgs = Array.isArray(db.organisations) ? db.organisations : [];
    return orgs.map(function (o) {
      var title = getField(o, ['name', 'organisationName', 'orgName']) || 'Untitled organisation';
      var type = getField(o, ['type', 'sector', 'category']);
      var location = getField(o, ['country', 'location', 'region']);
      return {
        title: title, type: type, location: location,
        relationships: relationshipsForEntity(db, o, title),
        activeProjects: activeProjectsForOrg(db, o, title),
        previousFunders: previousFundersForOrg(db, o),
        researchers: researchersForOrg(db, o, title),
        partners: partnersForOrg(db, o, title)
      };
    });
  }

  function renderOrgRelationshipsBlock(items) {
    var strs = items.map(function (r) { return r.type + ' \u2014 ' + r.counterpart; });
    return renderListBlock('Relationships', strs, 'No relationships recorded for this organisation.');
  }

  function renderOrgProjectsBlock(items) {
    var strs = items.map(function (p) { return p.title + (p.status ? ' (' + p.status + ')' : ''); });
    return renderListBlock('Active projects', strs, 'No active projects recorded for this organisation.');
  }

  function renderOrganisationIntelligence(list) {
    if (!list.length) {
      return '<div class="empty-state" style="padding:24px 0;"><p>No organisations recorded in the Strategic Database yet.</p></div>';
    }
    return list.map(function (oi) {
      return '<div class="project-card">' +
        '<div class="project-card-header"><h3>' + escapeHtml(oi.title) + '</h3>' +
        (oi.type ? '<span class="project-status-pill">' + escapeHtml(oi.type) + '</span>' : '') +
        (oi.location ? '<span class="project-status-pill">' + escapeHtml(oi.location) + '</span>' : '') +
        '</div>' +
        '<div class="intel-grid">' +
        renderOrgRelationshipsBlock(oi.relationships) +
        renderOrgProjectsBlock(oi.activeProjects) +
        renderListBlock('Previous funders', oi.previousFunders, 'No previous funders recorded for this organisation.') +
        renderListBlock('Researchers', oi.researchers, 'No researchers recorded for this organisation.') +
        renderListBlock('Partners', oi.partners, 'No partner organisations recorded.') +
        '</div></div>';
    }).join('');
  }

  // =================================================================
  // Ecosystem Mapping
  // -----------------------------------------------------------------
  // A read-only, interactive relationship graph across Projects,
  // Organisations, Researchers, Universities, NGOs, Funders and
  // Governments. Same standard as the rest of SIE: every node and
  // edge comes from a field that already exists somewhere in the
  // Strategic Database \u2014 nothing is invented.
  //
  // Universities / NGOs / Governments are not separate top-level
  // collections in the schema; they are organisations whose own
  // type/sector/category field identifies them as such, so they are
  // classified (not fabricated) out of db.organisations.
  //
  // Edges are drawn from db.relationships plus the same linking
  // fields Project Intelligence and Organisation Intelligence already
  // read (lead/collaborating organisations, matched funders,
  // affiliated researchers, partners, previous funders) \u2014 reusing
  // the existing resolver helpers so a link only appears here if it
  // would also have appeared in one of those sections.
  // =================================================================

  function classifyOrganisation(o) {
    var type = getField(o, ['type', 'sector', 'category']);
    var t = type.toLowerCase();
    if (/university|college|academ/.test(t)) return 'university';
    if (/\bngo\b|non-?profit|non-?governmental|charity|charitable|foundation/.test(t)) return 'ngo';
    if (/government|ministry|\bgov\b|department|public sector|\bstate\b|municipal|federal/.test(t)) return 'government';
    return 'organisation';
  }

  function buildEcosystemGraph(db) {
    var nodes = [];
    var nodeIndex = {};
    var titleIndex = {};

    function addNode(kind, title, idHint) {
      title = title && String(title).trim();
      if (!title) return null;
      var id = kind + ':' + (idHint != null ? idHint : title.toLowerCase());
      if (nodeIndex[id]) return nodeIndex[id];
      var node = { id: id, label: title, kind: kind, degree: 0 };
      nodes.push(node);
      nodeIndex[id] = node;
      var tKey = title.toLowerCase();
      if (!(tKey in titleIndex)) titleIndex[tKey] = id;
      return node;
    }

    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      addNode('project', title, p.id != null ? p.id : p._id);
    });
    (Array.isArray(db.organisations) ? db.organisations : []).forEach(function (o) {
      var title = getField(o, ['name', 'organisationName', 'orgName']) || 'Untitled organisation';
      addNode(classifyOrganisation(o), title, o.id != null ? o.id : o._id);
    });
    (Array.isArray(db.funders) ? db.funders : []).forEach(function (f) {
      var title = getField(f, ['name', 'funderName']) || 'Untitled funder';
      addNode('funder', title, f.id != null ? f.id : f._id);
    });
    (Array.isArray(db.researchers) ? db.researchers : []).forEach(function (r) {
      var title = getField(r, ['name', 'fullName']) || 'Untitled researcher';
      addNode('researcher', title, r.id != null ? r.id : r._id);
    });

    var edges = [];
    var edgeSeen = {};
    function addEdge(aTitle, bTitle, label) {
      if (!aTitle || !bTitle) return;
      var aId = titleIndex[String(aTitle).toLowerCase()];
      var bId = titleIndex[String(bTitle).toLowerCase()];
      if (!aId || !bId || aId === bId) return;
      var key = [aId, bId].sort().join('|') + '|' + label;
      if (edgeSeen[key]) return;
      edgeSeen[key] = true;
      edges.push({ source: aId, target: bId, label: label });
      nodeIndex[aId].degree++;
      nodeIndex[bId].degree++;
    }
    function orgNameFor(v) {
      if (typeof v === 'string') {
        var match = findByIdOrName(db.organisations, v);
        return match ? (getField(match, ['name', 'organisationName', 'orgName']) || v) : v;
      }
      return resolveCollaboratorName(v, db);
    }

    (Array.isArray(db.relationships) ? db.relationships : []).forEach(function (rel) {
      if (!rel || typeof rel !== 'object') return;
      var type = getField(rel, ['type', 'relationshipType', 'category']) || 'Relationship';
      var a = rel.source != null ? rel.source : (rel.from != null ? rel.from : rel.sourceId);
      var b = rel.target != null ? rel.target : (rel.to != null ? rel.to : rel.targetId);
      var aName = getField(rel, ['sourceName', 'fromName']) || resolveEntityLabel(a, db);
      var bName = getField(rel, ['targetName', 'toName']) || resolveEntityLabel(b, db);
      addEdge(aName, bName, type);
    });

    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var pTitle = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      [p.organisation, p.leadOrganisation, p.organisationId, p.orgId].forEach(function (v) {
        if (v == null) return;
        addEdge(pTitle, orgNameFor(v), 'Lead organisation');
      });
      getListField(p, ['collaborators', 'partners', 'collaboratingOrganisations', 'team']).forEach(function (entry) {
        addEdge(pTitle, resolveCollaboratorName(entry, db), 'Collaborator');
      });
      getListField(p, ['matchedFunders', 'fundingOpportunities', 'targetFunders', 'funders']).forEach(function (entry) {
        addEdge(pTitle, resolveFunderName(entry, db), 'Funding');
      });
    });

    (Array.isArray(db.organisations) ? db.organisations : []).forEach(function (o) {
      var oTitle = getField(o, ['name', 'organisationName', 'orgName']) || 'Untitled organisation';
      getListField(o, ['researchers', 'affiliatedResearchers']).forEach(function (entry) {
        var name = null;
        if (typeof entry === 'string') {
          var match = findByIdOrName(db.researchers, entry);
          name = match ? (getField(match, ['name', 'fullName']) || entry) : entry;
        } else if (entry && typeof entry === 'object') {
          name = getField(entry, ['name', 'fullName']);
        }
        addEdge(oTitle, name, 'Researcher');
      });
      getListField(o, ['partners', 'partnerOrganisations']).forEach(function (entry) {
        addEdge(oTitle, resolveCollaboratorName(entry, db), 'Partnership');
      });
      getListField(o, ['previousFunders', 'pastFunders', 'fundingHistory', 'fundersHistory']).forEach(function (entry) {
        addEdge(oTitle, resolveFunderName(entry, db), 'Previous funder');
      });
    });

    (Array.isArray(db.researchers) ? db.researchers : []).forEach(function (r) {
      var rTitle = getField(r, ['name', 'fullName']) || 'Untitled researcher';
      var aff = r.organisation != null ? r.organisation : (r.organisationId != null ? r.organisationId : r.affiliation);
      if (aff != null) addEdge(rTitle, orgNameFor(aff), 'Affiliation');
    });

    return { nodes: nodes, edges: edges };
  }

  /**
   * layoutGraph
   * ---------------------------------------------------------------
   * A small, dependency-free Fruchterman-Reingold force layout, run
   * synchronously to produce a stable starting arrangement. Positions
   * are then editable by the user via drag, so this only needs to run
   * once per render \u2014 but the repulsion pass is O(nodes^2) per
   * iteration, so on a large ecosystem graph (many hundreds of
   * projects/organisations/funders/researchers) that cost multiplies
   * fast. Three changes keep it fast without changing the resulting
   * layout in any way a user would notice:
   *   1. The hot O(n^2) loop uses plain indexed for-loops and hoists
   *      per-node reads/writes instead of nodes.forEach()/closures,
   *      and k*k is computed once instead of once per pair per
   *      iteration.
   *   2. Iteration count scales down as the node count grows \u2014 a
   *      dense graph needs far fewer full passes to reach a
   *      reasonable arrangement than a small one, since there's more
   *      averaging-out happening per step.
   *   3. Iteration stops early once the layout has settled (average
   *      per-node displacement stays below a small threshold for a
   *      few iterations in a row), since further iterations at that
   *      point don't move anything a visible amount.
   */
  function pickLayoutIterations(n) {
    if (n <= 120) return 220;
    if (n <= 300) return 160;
    if (n <= 700) return 100;
    if (n <= 1500) return 60;
    return 36;
  }

  function layoutGraph(nodes, edges, nodeById, width, height) {
    var n = nodes.length;
    if (!n) return;
    var k = Math.sqrt((width * height) / n) * 0.9;
    var k2 = k * k;

    for (var i0 = 0; i0 < n; i0++) {
      var node = nodes[i0];
      var angle = (i0 / n) * Math.PI * 2;
      var r = Math.min(width, height) * 0.35;
      node.x = width / 2 + r * Math.cos(angle) + (Math.random() - 0.5) * 10;
      node.y = height / 2 + r * Math.sin(angle) + (Math.random() - 0.5) * 10;
    }

    // Resolve edge endpoints once, up front, instead of looking them
    // up in nodeById on every one of the (up to 220) iterations.
    var eSrc = [], eTgt = [];
    for (var e = 0; e < edges.length; e++) {
      var ea = nodeById[edges[e].source], eb = nodeById[edges[e].target];
      if (!ea || !eb) continue;
      eSrc.push(ea); eTgt.push(eb);
    }
    var edgeCount = eSrc.length;

    var centerX = width / 2, centerY = height / 2;
    var temp = width / 10;
    var iterations = pickLayoutIterations(n);
    var minDisplacementThreshold = Math.max(0.05, Math.min(width, height) * 0.0006);
    var settledStreak = 0;

    for (var iter = 0; iter < iterations; iter++) {
      for (var z = 0; z < n; z++) { nodes[z].dx = 0; nodes[z].dy = 0; }

      for (var i = 0; i < n; i++) {
        var a = nodes[i], ax = a.x, ay = a.y, adx = a.dx, ady = a.dy;
        for (var j = i + 1; j < n; j++) {
          var b = nodes[j];
          var dx = ax - b.x, dy = ay - b.y;
