          var dist = Math.sqrt(dx * dx + dy * dy) || 0.01;
          var force = k2 / dist;
          var fx = (dx / dist) * force, fy = (dy / dist) * force;
          adx += fx; ady += fy;
          b.dx -= fx; b.dy -= fy;
        }
        a.dx = adx; a.dy = ady;
      }

      for (var ei = 0; ei < edgeCount; ei++) {
        var sA = eSrc[ei], sB = eTgt[ei];
        var edx = sA.x - sB.x, edy = sA.y - sB.y;
        var edist = Math.sqrt(edx * edx + edy * edy) || 0.01;
        var eforce = (edist * edist) / k;
        var efx = (edx / edist) * eforce, efy = (edy / edist) * eforce;
        sA.dx -= efx; sA.dy -= efy;
        sB.dx += efx; sB.dy += efy;
      }

      var totalDisp = 0;
      for (var v = 0; v < n; v++) {
        var vn = nodes[v];
        vn.dx += (centerX - vn.x) * 0.012;
        vn.dy += (centerY - vn.y) * 0.012;
        var disp = Math.sqrt(vn.dx * vn.dx + vn.dy * vn.dy) || 0.01;
        var lim = Math.min(disp, temp);
        vn.x += (vn.dx / disp) * lim;
        vn.y += (vn.dy / disp) * lim;
        if (vn.x < 28) vn.x = 28; else if (vn.x > width - 28) vn.x = width - 28;
        if (vn.y < 28) vn.y = 28; else if (vn.y > height - 28) vn.y = height - 28;
        totalDisp += lim;
      }

      temp = Math.max(1, temp * 0.97);

      if ((totalDisp / n) < minDisplacementThreshold) {
        settledStreak++;
        if (settledStreak >= 5) break;
      } else {
        settledStreak = 0;
      }
    }
  }

  var ECO_TYPE_META = {
    project:      { label: 'Projects',      color: 'var(--eco-project)' },
    organisation: { label: 'Organisations', color: 'var(--eco-organisation)' },
    university:   { label: 'Universities',  color: 'var(--eco-university)' },
    ngo:          { label: 'NGOs',          color: 'var(--eco-ngo)' },
    government:   { label: 'Governments',   color: 'var(--eco-government)' },
    funder:       { label: 'Funders',       color: 'var(--eco-funder)' },
    researcher:   { label: 'Researchers',   color: 'var(--eco-researcher)' }
  };
  var ECO_TYPE_ORDER = ['project', 'organisation', 'university', 'ngo', 'government', 'funder', 'researcher'];

  function ecoRadius(node) {
    return Math.max(6, Math.min(16, 6 + node.degree * 1.4));
  }

  function cssEscapeAttr(s) {
    return String(s).replace(/["\\]/g, '\\$&');
  }

  function renderEcosystemGraph(containerId, graph) {
    var container = document.getElementById(containerId);
    if (!container) return;

    if (!graph.nodes.length) {
      container.innerHTML = '<div class="empty-state" style="padding:24px 0;"><p>No projects, organisations, researchers or funders recorded yet to map relationships between.</p></div>';
      return;
    }

    var width = 900, height = 560;
    var nodeById = {};
    graph.nodes.forEach(function (n) { nodeById[n.id] = n; });
    layoutGraph(graph.nodes, graph.edges, nodeById, width, height);

    var edgesSvg = graph.edges.map(function (e) {
      var a = nodeById[e.source], b = nodeById[e.target];
      if (!a || !b) return '';
      return '<line class="eco-edge" data-a="' + escapeHtml(e.source) + '" data-b="' + escapeHtml(e.target) +
        '" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"></line>';
    }).join('');

    var nodesSvg = graph.nodes.map(function (node) {
      var meta = ECO_TYPE_META[node.kind] || ECO_TYPE_META.organisation;
      var r = ecoRadius(node);
      var shortLabel = node.label.length > 20 ? node.label.slice(0, 19) + '\u2026' : node.label;
      return '<g class="eco-node" data-id="' + escapeHtml(node.id) + '" data-kind="' + node.kind + '" transform="translate(' + node.x + ',' + node.y + ')">' +
        '<title>' + escapeHtml(node.label) + '</title>' +
        '<circle r="' + r + '" fill="' + meta.color + '"></circle>' +
        '<text class="eco-label" y="' + (r + 11) + '" text-anchor="middle">' + escapeHtml(shortLabel) + '</text>' +
      '</g>';
    }).join('');

    var legendHtml = ECO_TYPE_ORDER.map(function (kind) {
      var count = graph.nodes.filter(function (n) { return n.kind === kind; }).length;
      if (!count) return '';
      var meta = ECO_TYPE_META[kind];
      return '<label class="eco-legend-item">' +
        '<input type="checkbox" checked class="eco-toggle" data-kind="' + kind + '">' +
        '<span class="eco-dot" style="background:' + meta.color + '"></span>' +
        escapeHtml(meta.label) + ' <span class="eco-legend-count">' + count + '</span>' +
      '</label>';
    }).join('');

    container.innerHTML =
      '<div class="eco-toolbar">' +
        '<input type="text" id="ecoSearch" class="search-input eco-search" autocomplete="off" placeholder="Highlight an entity\u2026">' +
        '<div class="eco-legend">' + legendHtml + '</div>' +
      '</div>' +
      '<div class="eco-graph-wrap">' +
        '<svg id="ecoSvg" class="eco-svg" viewBox="0 0 ' + width + ' ' + height + '" xmlns="http://www.w3.org/2000/svg">' +
          '<g id="ecoViewport">' +
            '<g id="ecoEdges">' + edgesSvg + '</g>' +
            '<g id="ecoNodes">' + nodesSvg + '</g>' +
          '</g>' +
        '</svg>' +
        '<div class="eco-hint">Drag background to pan \u00b7 scroll to zoom \u00b7 drag a node to move it \u00b7 click a node for its connections</div>' +
      '</div>' +
      '<div id="ecoDetail" class="eco-detail"></div>';

    wireEcosystemInteractions(graph, nodeById, width, height);
  }

  function wireEcosystemInteractions(graph, nodeById, width, height) {
    var svg = document.getElementById('ecoSvg');
    var viewport = document.getElementById('ecoViewport');
    if (!svg || !viewport) return;

    var scale = 1, tx = 0, ty = 0;
    function applyTransform() {
      viewport.setAttribute('transform', 'translate(' + tx + ',' + ty + ') scale(' + scale + ')');
    }

    function clientToSvg(clientX, clientY) {
      var rect = svg.getBoundingClientRect();
      var x = (clientX - rect.left) * (width / rect.width);
      var y = (clientY - rect.top) * (height / rect.height);
      return { x: (x - tx) / scale, y: (y - ty) / scale };
    }

    function updateNodePosition(node) {
      var g = svg.querySelector('.eco-node[data-id="' + cssEscapeAttr(node.id) + '"]');
      if (g) g.setAttribute('transform', 'translate(' + node.x + ',' + node.y + ')');
      Array.prototype.forEach.call(svg.querySelectorAll('.eco-edge'), function (line) {
        if (line.getAttribute('data-a') === node.id) { line.setAttribute('x1', node.x); line.setAttribute('y1', node.y); }
        if (line.getAttribute('data-b') === node.id) { line.setAttribute('x2', node.x); line.setAttribute('y2', node.y); }
      });
    }

    function clearHighlight() {
      Array.prototype.forEach.call(svg.querySelectorAll('.eco-node, .eco-edge'), function (el) {
        el.classList.remove('eco-dim');
        el.classList.remove('eco-edge-active');
      });
      var detail = document.getElementById('ecoDetail');
      if (detail) detail.innerHTML = '';
    }

    function highlightNode(id) {
      var neighborIds = {};
      neighborIds[id] = true;
      graph.edges.forEach(function (e) {
        if (e.source === id) neighborIds[e.target] = true;
        if (e.target === id) neighborIds[e.source] = true;
      });
      Array.prototype.forEach.call(svg.querySelectorAll('.eco-node'), function (g) {
        g.classList.toggle('eco-dim', !neighborIds[g.getAttribute('data-id')]);
      });
      Array.prototype.forEach.call(svg.querySelectorAll('.eco-edge'), function (line) {
        var on = line.getAttribute('data-a') === id || line.getAttribute('data-b') === id;
        line.classList.toggle('eco-edge-active', on);
        line.classList.toggle('eco-dim', !on);
      });
    }

    function showDetail(id) {
      var node = nodeById[id];
      var detail = document.getElementById('ecoDetail');
      if (!node || !detail) return;
      var conns = uniqueStrings(graph.edges.filter(function (e) { return e.source === id || e.target === id; })
        .map(function (e) {
          var otherId = e.source === id ? e.target : e.source;
          var other = nodeById[otherId];
          return other ? (e.label + ' \u2014 ' + other.label) : null;
        }).filter(Boolean));
      var meta = ECO_TYPE_META[node.kind] || ECO_TYPE_META.organisation;
      detail.innerHTML = '<div class="project-card" style="margin-top:16px;">' +
        '<div class="project-card-header"><h3>' + escapeHtml(node.label) + '</h3>' +
        '<span class="project-status-pill">' + escapeHtml(meta.label) + '</span></div>' +
        renderListBlock('Connections', conns, 'No recorded connections for this entity.') +
      '</div>';
    }

    // Pan (background) + node drag
    var panning = false, panStart = null, dragNode = null;
    svg.addEventListener('mousedown', function (e) {
      if (e.target.closest && e.target.closest('.eco-node')) return;
      panning = true;
      panStart = { x: e.clientX, y: e.clientY, tx: tx, ty: ty };
    });
    Array.prototype.forEach.call(svg.querySelectorAll('.eco-node'), function (g) {
      g.addEventListener('mousedown', function (e) {
        e.stopPropagation();
        dragNode = nodeById[g.getAttribute('data-id')];
      });
      g.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = g.getAttribute('data-id');
        highlightNode(id);
        showDetail(id);
      });
    });
    window.addEventListener('mousemove', function (e) {
      if (panning && panStart) {
        tx = panStart.tx + (e.clientX - panStart.x);
        ty = panStart.ty + (e.clientY - panStart.y);
        applyTransform();
      } else if (dragNode) {
        var pt = clientToSvg(e.clientX, e.clientY);
        dragNode.x = pt.x; dragNode.y = pt.y;
        updateNodePosition(dragNode);
      }
    });
    window.addEventListener('mouseup', function () { panning = false; dragNode = null; });

    svg.addEventListener('click', clearHighlight);

    svg.addEventListener('wheel', function (e) {
      e.preventDefault();
      scale = Math.max(0.3, Math.min(3, scale * (e.deltaY < 0 ? 1.1 : 0.9)));
      applyTransform();
    }, { passive: false });

    // Legend filters
    Array.prototype.forEach.call(document.querySelectorAll('.eco-toggle'), function (cb) {
      cb.addEventListener('change', function () {
        var visibleKinds = {};
        Array.prototype.forEach.call(document.querySelectorAll('.eco-toggle'), function (c) {
          if (c.checked) visibleKinds[c.getAttribute('data-kind')] = true;
        });
        Array.prototype.forEach.call(svg.querySelectorAll('.eco-node'), function (g) {
          g.style.display = visibleKinds[g.getAttribute('data-kind')] ? '' : 'none';
        });
        Array.prototype.forEach.call(svg.querySelectorAll('.eco-edge'), function (line) {
          var a = nodeById[line.getAttribute('data-a')];
          var b = nodeById[line.getAttribute('data-b')];
          var show = a && b && visibleKinds[a.kind] && visibleKinds[b.kind];
          line.style.display = show ? '' : 'none';
        });
      });
    });

    // Search / highlight
    var searchInput = document.getElementById('ecoSearch');
    if (searchInput) {
      searchInput.addEventListener('input', function (e) {
        var q = e.target.value.trim().toLowerCase();
        if (!q) { clearHighlight(); return; }
        var matchIds = {};
        graph.nodes.forEach(function (n) { if (n.label.toLowerCase().indexOf(q) !== -1) matchIds[n.id] = true; });
        Array.prototype.forEach.call(svg.querySelectorAll('.eco-node'), function (g) {
          g.classList.toggle('eco-dim', !matchIds[g.getAttribute('data-id')]);
        });
        Array.prototype.forEach.call(svg.querySelectorAll('.eco-edge'), function (line) {
          line.classList.toggle('eco-dim', !(matchIds[line.getAttribute('data-a')] || matchIds[line.getAttribute('data-b')]));
        });
      });
    }
  }

  // =================================================================
  // Strategic Opportunity Detection
  // -----------------------------------------------------------------
  // Surfaces five things automatically from the same data every other
  // section already reads: duplicate projects, similar research,
  // potential collaborators, funding gaps, and new partnership
  // opportunities. Every finding here is the output of an explicit,
  // fixed rule evaluated against real fields (documented inline on
  // each detector) \u2014 nothing is generated or estimated text, and
  // nothing is written back to the database.
  // =================================================================

  var ECO_STOPWORDS = {
    'the':1,'and':1,'for':1,'with':1,'from':1,'into':1,'of':1,'a':1,'an':1,'to':1,'in':1,'on':1,'at':1,'by':1,
    'is':1,'are':1,'was':1,'were':1,'be':1,'been':1,'this':1,'that':1,'these':1,'those':1,'as':1,'it':1,'its':1,
    'their':1,'our':1,'we':1,'will':1,'shall':1,'can':1,'may':1,'project':1,'projects':1,'programme':1,
    'program':1,'initiative':1,'phase':1,'study':1,'new':1,'towards':1
  };

  function tokenize(text) {
    return String(text || '').toLowerCase().replace(/[^a-z0-9\s]/g, ' ').split(/\s+/)
      .filter(function (w) { return w.length >= 3 && !ECO_STOPWORDS[w]; });
  }
  function tokenSet(text) {
    var set = {};
    tokenize(text).forEach(function (w) { set[w] = 1; });
    return set;
  }
  function jaccard(setA, setB) {
    var keysA = Object.keys(setA), keysB = Object.keys(setB);
    if (!keysA.length || !keysB.length) return 0;
    var inter = 0;
    keysA.forEach(function (k) { if (setB[k]) inter++; });
    var union = keysA.length + keysB.length - inter;
    return union ? inter / union : 0;
  }

  function resolveOrgName(v, db) {
    if (typeof v === 'string') {
      var match = findByIdOrName(db.organisations, v);
      return match ? (getField(match, ['name', 'organisationName', 'orgName']) || v) : v;
    }
    return resolveCollaboratorName(v, db);
  }

  /**
   * buildProjectSimilarityPairs
   * ---------------------------------------------------------------
   * Every project pair, scored on two independent, fixed measures:
   * Jaccard similarity of title words and of description words (both
   * with common stopwords removed), plus whether they share a
   * recorded category. Duplicate Projects and Similar Research below
   * are just two different score bands read off this same table, so
   * a pair is never counted as both.
   */
  function buildProjectSimilarityPairs(db) {
    var projects = Array.isArray(db.projects) ? db.projects : [];
    var enriched = projects.map(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var desc = getField(p, ['description', 'summary', 'overview', 'details']);
      var category = getField(p, ['category', 'focusArea', 'theme']);
      return { title: title, category: category, titleSet: tokenSet(title), descSet: tokenSet(desc) };
    });
    var pairs = [];
    for (var i = 0; i < enriched.length; i++) {
      for (var j = i + 1; j < enriched.length; j++) {
        var a = enriched[i], b = enriched[j];
        var titleSim = jaccard(a.titleSet, b.titleSet);
        var descSim = jaccard(a.descSet, b.descSet);
        var sameCategory = !!a.category && !!b.category && a.category.toLowerCase() === b.category.toLowerCase();
        if (titleSim === 0 && descSim === 0 && !sameCategory) continue;
        pairs.push({ a: a.title, b: b.title, titleSim: titleSim, descSim: descSim, sameCategory: sameCategory, category: sameCategory ? a.category : null });
      }
    }
    return pairs;
  }

  // A pair counts as a likely Duplicate when their titles overlap
  // heavily, or their descriptions overlap heavily within the same
  // recorded category.
  function detectDuplicateProjects(pairs) {
    return pairs.filter(function (pr) {
      return pr.titleSim >= 0.5 || (pr.sameCategory && pr.descSim >= 0.4);
    }).sort(function (x, y) { return (y.titleSim + y.descSim) - (x.titleSim + x.descSim); });
  }

  // Similar Research is the band just below Duplicate \u2014 real
  // topical overlap, not the same project recorded twice. Anything
  // already flagged as a duplicate is excluded so nothing is listed
  // in both places.
  function detectSimilarResearch(pairs, duplicates) {
    var dupKeys = {};
    duplicates.forEach(function (d) { dupKeys[d.a + '|' + d.b] = true; });
    return pairs.filter(function (pr) {
      if (dupKeys[pr.a + '|' + pr.b]) return false;
      var titleBand = pr.titleSim >= 0.22 && pr.titleSim < 0.5;
      var descBand = pr.sameCategory && pr.descSim >= 0.18 && pr.descSim < 0.4;
      return titleBand || descBand;
    }).sort(function (x, y) { return (y.titleSim + y.descSim) - (x.titleSim + x.descSim); });
  }

  function formatSimilarityItem(pr) {
    var bits = [];
    if (pr.titleSim > 0) bits.push(Math.round(pr.titleSim * 100) + '% title overlap');
    if (pr.sameCategory) bits.push('same category (' + pr.category + ')');
    if (pr.descSim > 0) bits.push(Math.round(pr.descSim * 100) + '% description overlap');
    return '\u201c' + pr.a + '\u201d \u2194 \u201c' + pr.b + '\u201d \u2014 ' + bits.join(', ');
  }

  /**
   * detectPotentialCollaborators
   * ---------------------------------------------------------------
   * For every recorded category, collects the organisations already
   * leading or collaborating on a project in that category. For each
   * project, any organisation active elsewhere in its own category
   * but not already linked to it is surfaced as a suggestion \u2014
   * grounded entirely in collaborations that are already on record
   * for other projects.
   */
  function detectPotentialCollaborators(db) {
    var projects = Array.isArray(db.projects) ? db.projects : [];
    var categoryOrgs = {};

    function linkedOrgNames(p) {
      var names = {};
      [p.organisation, p.leadOrganisation, p.organisationId, p.orgId].forEach(function (v) {
        if (v == null) return;
        var n = resolveOrgName(v, db);
        if (n) names[n.toLowerCase()] = n;
      });
      getListField(p, ['collaborators', 'partners', 'collaboratingOrganisations', 'team']).forEach(function (entry) {
        var n = resolveCollaboratorName(entry, db);
        if (n) names[n.toLowerCase()] = n;
      });
      return names;
    }

    projects.forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var category = getField(p, ['category', 'focusArea', 'theme']);
      if (!category) return;
      var key = category.toLowerCase();
      var names = linkedOrgNames(p);
      Object.keys(names).forEach(function (lower) {
        (categoryOrgs[key] = categoryOrgs[key] || []).push({ org: names[lower], lower: lower, via: title });
      });
    });

    var suggestions = [];
    projects.forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var category = getField(p, ['category', 'focusArea', 'theme']);
      if (!category) return;
      var key = category.toLowerCase();
      var existing = linkedOrgNames(p);
      var seen = {};
      (categoryOrgs[key] || []).forEach(function (c) {
        if (existing[c.lower] || seen[c.lower] || c.via === title) return;
        seen[c.lower] = true;
        suggestions.push({ project: title, org: c.org, category: category, via: c.via });
      });
    });
    return suggestions;
  }

  /**
   * detectFundingGaps
   * ---------------------------------------------------------------
   * Three independent gap checks, each read off fields already used
   * elsewhere in SIE: projects with no matched funders (same
   * resolution Project Intelligence uses), recorded categories where
   * not one of their projects has a matched funder, and funders in
   * db.funders that have not been matched to any project yet.
   */
  function detectFundingGaps(db) {
    var projects = Array.isArray(db.projects) ? db.projects : [];
    var funders = Array.isArray(db.funders) ? db.funders : [];
    var unfundedProjects = [];
    var categoryFunderCount = {};
    var categoryLabels = {};
    var matchedFunderNames = {};

    projects.forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var category = getField(p, ['category', 'focusArea', 'theme']);
      var fundingRaw = getListField(p, ['matchedFunders', 'fundingOpportunities', 'targetFunders', 'funders']);
      var fundingNames = uniqueStrings(fundingRaw.map(function (entry) { return resolveFunderName(entry, db); }).filter(Boolean));
      fundingNames.forEach(function (n) { matchedFunderNames[n.toLowerCase()] = true; });
      if (!fundingNames.length) unfundedProjects.push(title);
      if (category) {
        var key = category.toLowerCase();
        categoryLabels[key] = category;
        categoryFunderCount[key] = (categoryFunderCount[key] || 0) + fundingNames.length;
      }
    });

    var categoryGaps = Object.keys(categoryFunderCount)
      .filter(function (k) { return categoryFunderCount[k] === 0; })
      .map(function (k) { return categoryLabels[k]; });

    var unusedFunders = uniqueStrings(funders.map(function (f) { return getField(f, ['name', 'funderName']); })
      .filter(function (name) { return name && !matchedFunderNames[name.toLowerCase()]; }));

    return {
      unfundedProjects: uniqueStrings(unfundedProjects),
      categoryGaps: uniqueStrings(categoryGaps),
      unusedFunders: unusedFunders
    };
  }

  var ECO_ORG_KINDS = { organisation: 1, university: 1, ngo: 1, government: 1 };

  /**
   * detectPartnershipOpportunities
   * ---------------------------------------------------------------
   * Reuses the Ecosystem Mapping graph: for every pair of
   * organisation-type nodes (organisation/university/ngo/government)
   * that are NOT already directly connected, counts how many
   * projects, funders or researchers they both already connect to.
   * Any pair with at least one such shared connection is a
   * "friend-of-a-friend" partnership candidate, ranked by how many
   * connections they already share.
   */
  function detectPartnershipOpportunities(graph) {
    var nodeById = {};
    graph.nodes.forEach(function (n) { nodeById[n.id] = n; });
    var adjacency = {};
    graph.nodes.forEach(function (n) { adjacency[n.id] = {}; });
    graph.edges.forEach(function (e) {
      adjacency[e.source][e.target] = true;
      adjacency[e.target][e.source] = true;
    });

    var orgNodes = graph.nodes.filter(function (n) { return ECO_ORG_KINDS[n.kind]; });
    var results = [];
    for (var i = 0; i < orgNodes.length; i++) {
      for (var j = i + 1; j < orgNodes.length; j++) {
        var a = orgNodes[i], b = orgNodes[j];
        if (adjacency[a.id][b.id]) continue;
        var shared = Object.keys(adjacency[a.id]).filter(function (nid) { return adjacency[b.id][nid]; });
        if (!shared.length) continue;
        var sharedLabels = shared.map(function (id) { return nodeById[id] ? nodeById[id].label : null; }).filter(Boolean);
        results.push({ a: a.label, b: b.label, sharedCount: shared.length, sharedLabels: sharedLabels });
      }
    }
    results.sort(function (x, y) { return y.sharedCount - x.sharedCount; });
    return results.slice(0, 25);
  }

  function computeStrategicOpportunities(db, graph) {
    var pairs = buildProjectSimilarityPairs(db);
    var duplicates = detectDuplicateProjects(pairs);
    var similar = detectSimilarResearch(pairs, duplicates);
    var collaborators = detectPotentialCollaborators(db);
    var fundingGaps = detectFundingGaps(db);
    var partnerships = detectPartnershipOpportunities(graph);

    var duplicateItems = duplicates.map(formatSimilarityItem);
    var similarItems = similar.map(formatSimilarityItem);
    var collaboratorItems = collaborators.map(function (c) {
      return c.org + ' \u2014 suggested for \u201c' + c.project + '\u201d (already active in ' + c.category + ' via \u201c' + c.via + '\u201d)';
    });
    var partnershipItems = partnerships.map(function (pr) {
      var shown = pr.sharedLabels.slice(0, 4).join(', ') + (pr.sharedLabels.length > 4 ? ', \u2026' : '');
      return pr.a + ' \u2194 ' + pr.b + ' \u2014 ' + pr.sharedCount + ' shared connection' + (pr.sharedCount === 1 ? '' : 's') + ': ' + shown;
    });

    var fundingGapCount = fundingGaps.unfundedProjects.length + fundingGaps.categoryGaps.length + fundingGaps.unusedFunders.length;
    var totalFlagged = duplicateItems.length + similarItems.length + collaboratorItems.length + fundingGapCount + partnershipItems.length;

    return {
      duplicateItems: duplicateItems,
      similarItems: similarItems,
      collaboratorItems: collaboratorItems,
      fundingGaps: fundingGaps,
      partnershipItems: partnershipItems,
      totalFlagged: totalFlagged
    };
  }

  function renderOpportunitySection(title, count, bodyHtml, badgeWord) {
    return '<div class="project-card">' +
      '<div class="project-card-header"><h3>' + escapeHtml(title) + '</h3>' +
      '<span class="project-status-pill">' + count + ' ' + (badgeWord || 'flagged') + '</span></div>' +
      bodyHtml +
    '</div>';
  }

  function renderOpportunityDetection(containerId, opp) {
    var container = document.getElementById(containerId);
    if (!container) return;

    container.innerHTML =
      renderOpportunitySection('Duplicate projects', opp.duplicateItems.length,
        renderListBlock('Likely duplicates', opp.duplicateItems, 'No projects with significant title or description overlap were found.')) +
      renderOpportunitySection('Similar research', opp.similarItems.length,
        renderListBlock('Related but distinct', opp.similarItems, 'No projects with moderate topical overlap were found.')) +
      renderOpportunitySection('Potential collaborators', opp.collaboratorItems.length,
        renderListBlock('Suggested by shared focus area', opp.collaboratorItems, 'No organisations already active in a project\u2019s category were found unlinked to it.')) +
      renderOpportunitySection('Funding gaps',
        opp.fundingGaps.unfundedProjects.length + opp.fundingGaps.categoryGaps.length + opp.fundingGaps.unusedFunders.length,
        '<div class="intel-grid">' +
          renderListBlock('Unfunded projects', opp.fundingGaps.unfundedProjects, 'Every project has at least one matched funder.') +
          renderListBlock('Categories with no funding coverage', opp.fundingGaps.categoryGaps, 'Every recorded category has at least one matched funder somewhere in it.') +
          renderListBlock('Funders not yet matched to a project', opp.fundingGaps.unusedFunders, 'Every recorded funder is already matched to at least one project.') +
        '</div>') +
      renderOpportunitySection('New partnership opportunities', opp.partnershipItems.length,
        renderListBlock('Shared-connection suggestions', opp.partnershipItems, 'No unconnected organisations share a common project, funder or researcher yet.'));
  }

  // =================================================================
  // Data Integrity & Synchronisation
  // -----------------------------------------------------------------
  // A read-only audit of the loaded Strategic Database itself \u2014
  // distinct from Strategic Opportunity Detection above, which looks
  // for insights *within* the data. This section checks whether the
  // sync that produced the data actually did its job correctly.
  // Everything here is derived from what's already in `db` (or, for
  // the schema-version check, a constant defined below matching
  // AAWFIP's own STRATEGIC_DB_SCHEMA_VERSION) \u2014 nothing is fetched
  // from AAWFIP directly (SIE never loads AAWFIP's code), nothing is
  // invented, and nothing is written back anywhere.
  //
  // Four checks:
  //   1. Export verification \u2014 for every collection/field AAWFIP's
  //      sync module is documented to populate, checks it has the
  //      right shape (array vs single object-or-null) and cross-
  //      checks the database's own declared metadata.recordCount
  //      against what's actually present (a mismatch usually means a
  //      partial or stale write).
  //   2. Duplicate records \u2014 flags repeated `id` values within a
  //      collection (two entries claiming the same identity is
  //      always a data problem, regardless of collection), plus
  //      repeated names for projects/organisations/funders as a
  //      softer, human-facing signal.
  //   3. Relationship validation \u2014 checks every entry in
  //      db.relationships actually resolves: a funderProjectFit's
  //      funderId must exist in db.funders (and its projectId, when
  //      not null, must exist in db.projects); a funderContact's
  //      funderId must exist in db.funders; and there should be
  //      exactly one organisationFunderIdentity record per
  //      organisation, reflecting AAWFIP's documented design that
  //      organisations and funders are the same underlying records.
  //   4. Version check \u2014 compares db.metadata.schemaVersion against
  //      SIE_EXPECTED_SCHEMA_VERSION and flags the database as
  //      outdated (needs a re-sync in AAWFIP) or newer than this
  //      build of SIE knows how to read.
  // =================================================================

  // The Strategic Database schema version this build of SIE was
  // written to understand \u2014 matches AAWFIP v46's own
  // STRATEGIC_DB_SCHEMA_VERSION (8, which added the `relationships`
  // collection). Update this constant, and EXPECTED_COLLECTIONS
  // above, whenever SIE is updated to understand a newer AAWFIP
  // schema.
  var SIE_EXPECTED_SCHEMA_VERSION = 8;

  // Collections AAWFIP's sync module actively populates on every
  // sync from a real, existing source module, plus a human-readable
  // name for that source \u2014 used only for display in the export
  // verification list below.
  var ACTIVE_EXPORT_CHECKS = [
    { key: 'projects', kind: 'array', module: 'My Projects Store' },
    { key: 'organisations', kind: 'array', module: 'Organisation Engine' },
    { key: 'funders', kind: 'array', module: 'Funding Engine' },
    { key: 'applicantCompetitiveness', kind: 'object-or-null', module: 'Applicant Competitiveness Engine' },
    { key: 'relationships', kind: 'array', module: 'Relationships (derived from funders / organisations / projects)' }
  ];

  // Collections that exist in the schema as reserved placeholders \u2014
  // AAWFIP does not yet have a source module to populate these from,
  // so they are expected to be empty. Flagged separately (not as
  // failures) so a genuinely broken export isn't confused with a
  // feature that simply hasn't been built yet.
  var RESERVED_EXPORT_CHECKS = [
    { key: 'competitors', module: 'Competitor Intelligence Engine' },
    { key: 'researchers', module: 'Researcher data module' },
    { key: 'publications', module: 'Publications data module' },
    { key: 'fundingSchemes', module: '(no source module wired yet)' },
    { key: 'contacts', module: '(no source module wired yet \u2014 see funder.profile.contacts, exported via relationships instead)' },
    { key: 'changeLog', module: '(no source module wired yet)' }
  ];

  function idKey(record) {
    if (!record || record.id === undefined || record.id === null || record.id === '') return null;
    return String(record.id);
  }

  /**
   * checkExports
   * ---------------------------------------------------------------
   * Verifies every actively-synced collection has the shape AAWFIP's
   * sync module is documented to write, and cross-checks the
   * database's own declared metadata.recordCount against a fresh sum
   * over what's actually present. Read-only; never mutates db.
   */
  function checkExports(db) {
    var meta = db.metadata || {};

    var active = ACTIVE_EXPORT_CHECKS.map(function (check) {
      var value = db[check.key];
      var present = Object.prototype.hasOwnProperty.call(db, check.key);
      var shapeOk = check.kind === 'array'
        ? Array.isArray(value)
        : (value === null || value === undefined || (typeof value === 'object' && !Array.isArray(value)));
      return {
        key: check.key,
        module: check.module,
        present: present,
        shapeOk: shapeOk,
        count: Array.isArray(value) ? value.length : (value ? 1 : 0)
      };
    });

    var reserved = RESERVED_EXPORT_CHECKS.map(function (check) {
      var value = db[check.key];
      var present = Object.prototype.hasOwnProperty.call(db, check.key);
      return {
        key: check.key,
        module: check.module,
        present: present,
        shapeOk: present ? Array.isArray(value) : true,
        count: Array.isArray(value) ? value.length : 0
      };
    });

    var actualCount =
      countOf(db.organisations) + countOf(db.fundingSchemes) + countOf(db.contacts) +
      countOf(db.projects) + countOf(db.funders) + (db.applicantCompetitiveness ? 1 : 0) +
      countOf(db.competitors) + countOf(db.researchers) + countOf(db.publications) +
      countOf(db.relationships);
    var declaredCount = (typeof meta.recordCount === 'number') ? meta.recordCount : null;

    return {
      active: active,
      reserved: reserved,
      actualCount: actualCount,
      declaredCount: declaredCount,
      recordCountOk: declaredCount === null ? null : (declaredCount === actualCount)
    };
  }

  /**
   * checkDuplicates
   * ---------------------------------------------------------------
   * Flags repeated `id` values within each collection (an actual
   * data-integrity problem \u2014 two records can't share one identity),
   * plus repeated names within projects/organisations/funders as a
   * softer signal a person can use their own judgement on (e.g. two
   * genuinely different funders sharing a generic name).
   */
  function checkDuplicates(db) {
    function findIdDupes(list, label) {
      if (!Array.isArray(list)) return [];
      var counts = {};
      list.forEach(function (item) {
        var key = idKey(item);
        if (key === null) return;
        counts[key] = (counts[key] || 0) + 1;
      });
      var out = [];
      Object.keys(counts).forEach(function (key) {
        if (counts[key] > 1) out.push(label + ' \u2014 id "' + key + '" appears ' + counts[key] + ' times');
      });
      return out;
    }

    function findNameDupes(list, label, nameFields) {
      if (!Array.isArray(list)) return [];
      var counts = {};
      list.forEach(function (item) {
        var name = getField(item, nameFields);
        if (!name) return;
        var key = name.trim().toLowerCase();
        counts[key] = counts[key] || { name: name, n: 0 };
        counts[key].n++;
      });
      var out = [];
      Object.keys(counts).forEach(function (key) {
        if (counts[key].n > 1) out.push(label + ' \u2014 "' + counts[key].name + '" appears ' + counts[key].n + ' times');
      });
      return out;
    }

    var idDupes = []
      .concat(findIdDupes(db.projects, 'Projects'))
      .concat(findIdDupes(db.organisations, 'Organisations'))
      .concat(findIdDupes(db.funders, 'Funders'))
      .concat(findIdDupes(db.competitors, 'Competitors'))
      .concat(findIdDupes(db.researchers, 'Researchers'))
      .concat(findIdDupes(db.publications, 'Publications'));

    var nameDupes = []
      .concat(findNameDupes(db.projects, 'Projects', ['title', 'name', 'projectName', 'projectTitle']))
      .concat(findNameDupes(db.organisations, 'Organisations', ['name', 'organisationName', 'orgName']))
      .concat(findNameDupes(db.funders, 'Funders', ['name', 'funderName']));

    return { idDupes: idDupes, nameDupes: nameDupes };
  }

  /**
   * checkRelationships
   * ---------------------------------------------------------------
   * Validates db.relationships against the collections it's derived
   * from (db.funders / db.projects / db.organisations), matching by
   * id exactly the way AAWFIP's own deriveRelationships() built the
   * records in the first place. A funderProjectFit or funderContact
   * whose funderId doesn't resolve, or a funderProjectFit whose
   * (non-null) projectId doesn't resolve, means the relationships
   * collection has drifted from the records it's supposed to link \u2014
   * most likely because one side was edited/re-synced without the
   * other. organisationFunderIdentity coverage is checked as a count
   * (one expected per organisation) rather than only individual
   * lookups, since AAWFIP's own design has funderId === organisationId
   * for that record type.
   */
  function checkRelationships(db) {
    var relationships = Array.isArray(db.relationships) ? db.relationships : [];
    var funderIds = {}, projectIds = {}, orgIds = {};
    (Array.isArray(db.funders) ? db.funders : []).forEach(function (f) {
      var k = idKey(f); if (k) funderIds[k] = true;
    });
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var k = idKey(p); if (k) projectIds[k] = true;
    });
    (Array.isArray(db.organisations) ? db.organisations : []).forEach(function (o) {
      var k = idKey(o); if (k) orgIds[k] = true;
    });

    var brokenFunderRefs = [];
    var brokenProjectRefs = [];
    var brokenIdentityRefs = [];
    var funderFitCount = 0, contactCount = 0, identityCount = 0;

    relationships.forEach(function (rel) {
      if (!rel || !rel.type) return;
      if (rel.type === 'funderProjectFit') {
        funderFitCount++;
        if (rel.funderId != null && !funderIds[String(rel.funderId)]) {
          brokenFunderRefs.push('"' + (rel.funderName || rel.funderId) + '" \u2014 funder no longer found in Funders (relationship type: funder \u2194 project fit)');
        }
        if (rel.projectId != null && !projectIds[String(rel.projectId)]) {
          brokenProjectRefs.push('"' + (rel.projectName || rel.projectId) + '" \u2014 project no longer found in Projects (matched to funder "' + (rel.funderName || rel.funderId) + '")');
        }
      } else if (rel.type === 'funderContact') {
        contactCount++;
        if (rel.funderId != null && !funderIds[String(rel.funderId)]) {
          brokenFunderRefs.push('"' + (rel.funderName || rel.funderId) + '" \u2014 funder no longer found in Funders (relationship type: funder contact "' + (rel.contactName || 'unnamed') + '")');
        }
      } else if (rel.type === 'organisationFunderIdentity') {
        identityCount++;
        if (rel.organisationId != null && !orgIds[String(rel.organisationId)]) {
          brokenIdentityRefs.push('"' + (rel.name || rel.organisationId) + '" \u2014 organisation no longer found in Organisations');
        }
        if (rel.funderId != null && !funderIds[String(rel.funderId)]) {
          brokenIdentityRefs.push('"' + (rel.name || rel.funderId) + '" \u2014 funder no longer found in Funders');
        }
      }
    });

    var orgCount = countOf(db.organisations);
    var funderCount = countOf(db.funders);
    var identityCoverageOk = orgCount === identityCount;
    var orgFunderCountsMatch = orgCount === funderCount;

    return {
      total: relationships.length,
      funderFitCount: funderFitCount,
      contactCount: contactCount,
      identityCount: identityCount,
      orgCount: orgCount,
      funderCount: funderCount,
      identityCoverageOk: identityCoverageOk,
      orgFunderCountsMatch: orgFunderCountsMatch,
      brokenFunderRefs: brokenFunderRefs,
      brokenProjectRefs: brokenProjectRefs,
      brokenIdentityRefs: brokenIdentityRefs
    };
  }

  /**
   * checkVersion
   * ---------------------------------------------------------------
   * Compares the loaded database's declared schema version against
   * SIE_EXPECTED_SCHEMA_VERSION. Three outcomes: 'current' (equal),
   * 'outdated' (database's version is older than what this SIE build
   * expects \u2014 re-sync in AAWFIP will upgrade it in place, since
   * AAWFIP's own load/ensure functions are additive), or 'newer'
   * (database's version is ahead of this SIE build \u2014 AAWFIP has
   * added collections this version of SIE doesn't yet know to read).
   * 'unknown' if no version is recorded at all.
   */
  function checkVersion(db) {
    var meta = db.metadata || {};
    var dbVersion = (typeof meta.schemaVersion === 'number') ? meta.schemaVersion : null;
    var status;
    if (dbVersion === null) status = 'unknown';
    else if (dbVersion === SIE_EXPECTED_SCHEMA_VERSION) status = 'current';
    else if (dbVersion < SIE_EXPECTED_SCHEMA_VERSION) status = 'outdated';
    else status = 'newer';
    return { dbVersion: dbVersion, expectedVersion: SIE_EXPECTED_SCHEMA_VERSION, status: status };
  }

  /**
   * computeDataIntegrity
   * ---------------------------------------------------------------
   * Runs all four checks and rolls them up into a single overall
   * status ('ok' or 'warn') for the top banner. Any shape mismatch,
   * record-count mismatch, duplicate id, broken relationship
   * reference, or non-current schema version puts the banner into
   * 'warn' \u2014 duplicate *names* alone do not, since a shared name can
   * be legitimate and is shown as a softer signal rather than a fault.
   */
  function computeDataIntegrity(db) {
    var exportCheck = checkExports(db);
    var dupCheck = checkDuplicates(db);
    var relCheck = checkRelationships(db);
    var versionCheck = checkVersion(db);

    var hasShapeIssue = exportCheck.active.some(function (c) { return !c.shapeOk; }) ||
      exportCheck.reserved.some(function (c) { return !c.shapeOk; });
    var hasRecordCountIssue = exportCheck.recordCountOk === false;
    var hasIdDupes = dupCheck.idDupes.length > 0;
    var hasBrokenRefs = relCheck.brokenFunderRefs.length > 0 || relCheck.brokenProjectRefs.length > 0 ||
      relCheck.brokenIdentityRefs.length > 0 || !relCheck.identityCoverageOk || !relCheck.orgFunderCountsMatch;
    var hasVersionIssue = versionCheck.status !== 'current';

    var overall = (hasShapeIssue || hasRecordCountIssue || hasIdDupes || hasBrokenRefs || hasVersionIssue) ? 'warn' : 'ok';

    return {
      exportCheck: exportCheck, dupCheck: dupCheck, relCheck: relCheck, versionCheck: versionCheck,
      overall: overall
    };
  }

  function integrityRow(label, ok, detail) {
    return '<div class="integrity-row">' +
      '<span class="integrity-pill ' + (ok ? 'ok' : 'fail') + '">' + (ok ? 'Pass' : 'Fail') + '</span>' +
      '<span class="integrity-label">' + escapeHtml(label) + '</span>' +
      (detail ? '<span class="integrity-detail">' + escapeHtml(detail) + '</span>' : '') +
    '</div>';
  }

  function versionMessage(vc) {
    if (vc.status === 'unknown') {
      return 'This database doesn\u2019t record a schema version at all \u2014 it likely predates version checking. Re-synchronise from AAWFIP to bring it up to date.';
    }
    if (vc.status === 'current') {
      return 'Schema v' + vc.dbVersion + ' \u2014 matches what this build of SIE expects.';
    }
    if (vc.status === 'outdated') {
      return 'Schema v' + vc.dbVersion + ' is older than v' + vc.expectedVersion + ', the version this build of SIE expects. Open AAWFIP and click \u201cSynchronise Strategic Intelligence\u201d again \u2014 its sync module upgrades the database in place (no data is lost), then reload this page.';
    }
    return 'Schema v' + vc.dbVersion + ' is newer than v' + vc.expectedVersion + ', the version this build of SIE was written to understand. AAWFIP has added collections since this SIE build was last updated \u2014 data may be present but not shown here. Update SIE to a version that understands schema v' + vc.dbVersion + '.';
  }

  function renderDataIntegrity(containerId, integrity) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var exp = integrity.exportCheck, dup = integrity.dupCheck, rel = integrity.relCheck, vc = integrity.versionCheck;

    var bannerText = integrity.overall === 'ok'
      ? 'All export, duplicate, relationship and version checks passed \u2014 this Strategic Database is internally consistent.'
      : 'One or more checks below need attention \u2014 see the details in each panel.';
    var banner =
      '<div class="integrity-banner ' + (integrity.overall === 'ok' ? 'ok' : 'warn') + '">' +
        '<span class="integrity-pill ' + (integrity.overall === 'ok' ? 'ok' : 'warn') + '">' +
          (integrity.overall === 'ok' ? 'All checks passed' : 'Needs attention') +
        '</span>' +
        '<span>' + escapeHtml(bannerText) + '</span>' +
      '</div>';

    // --- 1. Export verification -------------------------------------
    var exportRows = exp.active.map(function (c) {
      var ok = c.present && c.shapeOk;
      var detail = ok ? (c.count + ' record' + (c.count === 1 ? '' : 's')) : 'Missing or wrong shape';
      return integrityRow(c.key + ' \u2014 ' + c.module, ok, detail);
    }).join('');
    var reservedRows = exp.reserved.map(function (c) {
      var ok = c.present && c.shapeOk;
      return integrityRow(c.key + ' (reserved) \u2014 ' + c.module, ok,
        ok ? (c.count + ' record' + (c.count === 1 ? '' : 's') + ', as expected while unbuilt') : 'Missing or wrong shape');
    }).join('');
    var recordCountRow = exp.declaredCount === null
      ? integrityRow('metadata.recordCount', true, 'Not recorded on this database \u2014 nothing to cross-check')
      : integrityRow('metadata.recordCount matches actual record total', exp.recordCountOk,
          'Declared ' + exp.declaredCount + ', actual ' + exp.actualCount +
          (exp.recordCountOk ? '' : ' \u2014 mismatch suggests a partial or stale sync'));

    var exportSection = renderOpportunitySection(
      'Module export verification',
      exp.active.filter(function (c) { return !(c.present && c.shapeOk); }).length +
        exp.reserved.filter(function (c) { return !(c.present && c.shapeOk); }).length +
        (exp.recordCountOk === false ? 1 : 0),
      '<div class="intel-block"><div class="label">Actively synced collections</div>' + exportRows + '</div>' +
      '<div class="intel-block"><div class="label">Reserved collections (no source module yet)</div>' + reservedRows + '</div>' +
      '<div class="intel-block"><div class="label">Record count cross-check</div>' + recordCountRow + '</div>',
      'issue' + (exp.active.length + exp.reserved.length === 1 ? '' : 's')
    );

    // --- 2. Duplicate records ------------------------------------------
    var duplicateSection = renderOpportunitySection(
      'Duplicate records',
      dup.idDupes.length,
      '<div class="intel-grid">' +
        renderListBlock('Duplicate IDs (data integrity fault)', dup.idDupes, 'No two records in any collection share the same id.') +
        renderListBlock('Duplicate names (informational \u2014 may be legitimate)', dup.nameDupes, 'No repeated project, organisation or funder names were found.') +
      '</div>'
    );

    // --- 3. Relationship validation -------------------------------------
    var relCoverageItems = [];
    relCoverageItems.push(rel.orgFunderCountsMatch
      ? 'Organisations (' + rel.orgCount + ') and Funders (' + rel.funderCount + ') counts match \u2014 confirmed'
      : 'Organisations (' + rel.orgCount + ') and Funders (' + rel.funderCount + ') counts do NOT match \u2014 they\u2019re documented to be the same underlying records, so this indicates a partial sync');
    relCoverageItems.push(rel.identityCoverageOk
      ? 'organisationFunderIdentity coverage complete \u2014 ' + rel.identityCount + ' of ' + rel.orgCount + ' organisations'
      : 'organisationFunderIdentity coverage incomplete \u2014 ' + rel.identityCount + ' of ' + rel.orgCount + ' organisations have an identity record');

    var relationshipSection = renderOpportunitySection(
      'Relationship validation',
      rel.brokenFunderRefs.length + rel.brokenProjectRefs.length + rel.brokenIdentityRefs.length +
        (rel.identityCoverageOk ? 0 : 1) + (rel.orgFunderCountsMatch ? 0 : 1),
      '<div class="intel-block"><div class="label">Coverage</div>' +
        '<ul><li>' + escapeHtml('Total relationships: ' + rel.total +
          ' (' + rel.funderFitCount + ' funder\u2194project fit, ' + rel.contactCount + ' funder contact, ' +
          rel.identityCount + ' organisation\u2194funder identity)') + '</li>' +
        relCoverageItems.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') +
        '</ul></div>' +
      '<div class="intel-grid">' +
        renderListBlock('Relationships referencing a missing funder', rel.brokenFunderRefs, 'Every relationship\u2019s funderId resolves to a real funder record.') +
        renderListBlock('Relationships referencing a missing project', rel.brokenProjectRefs, 'Every funder\u2194project fit\u2019s projectId resolves to a real project record (or was correctly recorded as unmatched).') +
        renderListBlock('Broken organisation\u2194funder identity links', rel.brokenIdentityRefs, 'Every organisation\u2194funder identity record resolves on both sides.') +
      '</div>'
    );

    // --- 4. Version check -----------------------------------------------
    var versionSection =
      '<div class="project-card">' +
        '<div class="project-card-header"><h3>Database version</h3>' +
        '<span class="project-status-pill">' +
          (vc.status === 'current' ? 'Up to date' : vc.status === 'outdated' ? 'Outdated' : vc.status === 'newer' ? 'Newer than SIE' : 'Unknown') +
        '</span></div>' +
        '<p style="margin:10px 0 0; color:var(--text-mid); font-size:0.88rem;">' + escapeHtml(versionMessage(vc)) + '</p>' +
      '</div>';

    container.innerHTML = banner + exportSection + duplicateSection + relationshipSection + versionSection;
  }

  // =================================================================
  // Timeline Intelligence
  // -----------------------------------------------------------------
  // Four date-oriented views built from fields already used
  // elsewhere in SIE: funding deadlines (the same project deadline
  // field Project Intelligence's Risks check reads, plus any
  // deadline recorded directly on a funder/funding scheme), project
  // milestones (a project's own milestones/keyDates/deliverables/
  // schedule array, when its entries carry a date), synchronisation
  // history (db.changeLog \u2014 AAWFIP's own sync log, already an
  // expected top-level collection), and upcoming opportunities
  // (funders/funding schemes not yet matched to any project, whose
  // deadline \u2014 if they have one \u2014 has not yet passed). Nothing here
  // is invented: an item with no parsable date is simply left off
  // the relevant list rather than guessed at.
  // =================================================================

  function parseDateSafe(raw) {
    if (!raw) return null;
    var d = new Date(raw);
    return isNaN(d.getTime()) ? null : d;
  }

  function daysBetween(date, from) {
    return Math.round((date.getTime() - from.getTime()) / (1000 * 60 * 60 * 24));
  }

  function formatRelativeDays(date, now) {
    var days = daysBetween(date, now);
    if (days === 0) return 'today';
    if (days > 0) return 'in ' + days + ' day' + (days === 1 ? '' : 's');
    return Math.abs(days) + ' day' + (Math.abs(days) === 1 ? '' : 's') + ' overdue';
  }

  function collectFundingDeadlines(db) {
    var out = [];
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var title = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      var date = parseDateSafe(getField(p, ['deadline', 'applicationDeadline', 'dueDate']));
      if (date) out.push({ date: date, label: title, source: 'project' });
    });
    [db.funders, db.fundingSchemes].forEach(function (collection) {
      (Array.isArray(collection) ? collection : []).forEach(function (f) {
        var name = getField(f, ['name', 'funderName', 'fundingSchemeName']) || 'Untitled funder';
        var date = parseDateSafe(getField(f, ['deadline', 'applicationDeadline', 'closingDate', 'nextDeadline', 'submissionDeadline']));
        if (date) out.push({ date: date, label: name, source: 'funder' });
      });
    });
    return out;
  }

  function collectProjectMilestones(db) {
    var out = [];
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      var projectTitle = getField(p, ['name', 'title', 'projectName', 'projectTitle']) || 'Untitled project';
      getListField(p, ['milestones', 'keyDates', 'deliverables', 'schedule']).forEach(function (entry) {
        var title, raw, status;
        if (typeof entry === 'string') {
          title = entry; raw = null; status = '';
        } else if (entry && typeof entry === 'object') {
          title = getField(entry, ['title', 'name', 'label', 'milestone']) || 'Milestone';
          raw = getField(entry, ['date', 'dueDate', 'targetDate', 'deadline']);
          status = getField(entry, ['status', 'stage']);
        } else {
          return;
        }
        var date = parseDateSafe(raw);
        if (!date) return;
        out.push({ date: date, label: title, project: projectTitle, status: status });
      });
    });
    return out;
  }

  function collectSyncHistory(db) {
    var out = [];
    (Array.isArray(db.changeLog) ? db.changeLog : []).forEach(function (entry) {
      if (typeof entry === 'string') {
        out.push({ date: null, label: entry });
        return;
      }
      if (entry && typeof entry === 'object') {
        var date = parseDateSafe(getField(entry, ['date', 'timestamp', 'syncedAt', 'createdAt', 'at']));
        var desc = getField(entry, ['description', 'summary', 'message', 'action', 'note', 'event']) || 'Synchronisation event';
        out.push({ date: date, label: desc });
      }
    });
    return out;
  }

  function collectUpcomingOpportunities(db) {
    var matchedFunderNames = {};
    (Array.isArray(db.projects) ? db.projects : []).forEach(function (p) {
      getListField(p, ['matchedFunders', 'fundingOpportunities', 'targetFunders', 'funders']).forEach(function (entry) {
        var n = resolveFunderName(entry, db);
        if (n) matchedFunderNames[n.toLowerCase()] = true;
      });
    });
    var out = [];
    [db.funders, db.fundingSchemes].forEach(function (collection) {
      (Array.isArray(collection) ? collection : []).forEach(function (f) {
        var name = getField(f, ['name', 'funderName', 'fundingSchemeName']) || 'Untitled funder';
        if (matchedFunderNames[name.toLowerCase()]) return;
        var date = parseDateSafe(getField(f, ['deadline', 'applicationDeadline', 'closingDate', 'nextDeadline', 'submissionDeadline']));
        out.push({ date: date, label: name });
      });
    });
    return out;
  }

  function formatDeadlineItem(item, now) {
    return item.label + ' \u2014 ' + formatDate(item.date.toISOString()) + ' (' + formatRelativeDays(item.date, now) + ')';
  }

  function formatMilestoneItem(item, now) {
    var bits = [item.project];
    if (item.status) bits.push(item.status);
    return item.label + ' \u2014 ' + formatDate(item.date.toISOString()) + ' (' + formatRelativeDays(item.date, now) + ') \u2014 ' + bits.join(', ');
  }

  function formatSyncItem(item) {
    var when = item.date ? formatDate(item.date.toISOString()) : 'Undated';
    return when + ' \u2014 ' + item.label;
  }

  function formatOpportunityItem(item, now) {
    if (!item.date) return item.label + ' \u2014 no deadline recorded (rolling / ongoing)';
    return item.label + ' \u2014 ' + formatDate(item.date.toISOString()) + ' (' + formatRelativeDays(item.date, now) + ')';
  }

  function computeTimelineIntelligence(db) {
    var now = new Date();

    var deadlines = collectFundingDeadlines(db).sort(function (a, b) { return a.date - b.date; });
    var milestones = collectProjectMilestones(db).sort(function (a, b) { return a.date - b.date; });
    var syncHistory = collectSyncHistory(db).sort(function (a, b) {
      if (!a.date && !b.date) return 0;
      if (!a.date) return 1;
      if (!b.date) return -1;
      return b.date - a.date;
    });
    var opportunities = collectUpcomingOpportunities(db)
      .filter(function (o) { return !o.date || o.date >= now; })
      .sort(function (a, b) {
        if (!a.date && !b.date) return 0;
        if (!a.date) return 1;
        if (!b.date) return -1;
        return a.date - b.date;
      });

    var deadlinesOverdue = deadlines.filter(function (d) { return d.date < now; });
    var deadlinesUpcoming = deadlines.filter(function (d) { return d.date >= now; });
    var milestonesOverdue = milestones.filter(function (m) { return m.date < now; });
    var milestonesUpcoming = milestones.filter(function (m) { return m.date >= now; });

    var soonCutoff = new Date(now.getTime() + 30 * 24 * 60 * 60 * 1000);
    var dueWithin30Days = deadlinesUpcoming.filter(function (d) { return d.date <= soonCutoff; }).length +
      milestonesUpcoming.filter(function (m) { return m.date <= soonCutoff; }).length;

    return {
      dueWithin30Days: dueWithin30Days,
      deadlinesOverdueItems: deadlinesOverdue.map(function (d) { return formatDeadlineItem(d, now); }),
      deadlinesUpcomingItems: deadlinesUpcoming.map(function (d) { return formatDeadlineItem(d, now); }),
      milestonesOverdueItems: milestonesOverdue.map(function (m) { return formatMilestoneItem(m, now); }),
      milestonesUpcomingItems: milestonesUpcoming.map(function (m) { return formatMilestoneItem(m, now); }),
      syncHistoryItems: syncHistory.map(formatSyncItem),
      opportunityItems: opportunities.map(function (o) { return formatOpportunityItem(o, now); })
    };
  }

  function renderTimelineIntelligence(containerId, tl) {
    var container = document.getElementById(containerId);
    if (!container) return;

    container.innerHTML =
      renderOpportunitySection('Funding deadlines',
        tl.deadlinesOverdueItems.length + tl.deadlinesUpcomingItems.length,
        '<div class="intel-grid">' +
          renderListBlock('Overdue', tl.deadlinesOverdueItems, 'No overdue funding deadlines.', 'risks') +
          renderListBlock('Upcoming', tl.deadlinesUpcomingItems, 'No upcoming funding deadlines recorded.') +
        '</div>', 'recorded') +
      renderOpportunitySection('Project milestones',
        tl.milestonesOverdueItems.length + tl.milestonesUpcomingItems.length,
        '<div class="intel-grid">' +
          renderListBlock('Overdue', tl.milestonesOverdueItems, 'No overdue milestones.', 'risks') +
          renderListBlock('Upcoming', tl.milestonesUpcomingItems, 'No upcoming milestones recorded.') +
        '</div>', 'recorded') +
      renderOpportunitySection('Synchronisation history', tl.syncHistoryItems.length,
        renderListBlock('Recorded sync events, most recent first', tl.syncHistoryItems, 'No synchronisation history recorded yet.'), 'recorded') +
      renderOpportunitySection('Upcoming opportunities', tl.opportunityItems.length,
        renderListBlock('Not yet matched to a project', tl.opportunityItems, 'Every recorded funder is already matched to a project, or none are recorded yet.'), 'open');
  }

  // =================================================================
  // Strategic Reports
  // -----------------------------------------------------------------
  // Read-only report views assembled entirely from data already
  // computed by the sections above (Project Intelligence,
  // Organisation Intelligence, Ecosystem Mapping, Strategic
  // Opportunity Detection, Timeline Intelligence). Nothing here
  // recomputes or invents a figure \u2014 every table and list is built
  // from the same records those sections already read. Export is a
  // plain browser print (Save as PDF), scoped to just the report via
  // the #reportPrintArea print stylesheet above, so no external
  // library or network access is required.
  // =================================================================

  var REPORT_TYPES = [
    { id: 'funding', label: 'Funding strategy' },
    { id: 'collaboration', label: 'Collaboration strategy' },
    { id: 'portfolio', label: 'Portfolio overview' },
    { id: 'pipeline', label: 'Research pipeline' },
    { id: 'opportunity', label: 'Opportunity report' }
  ];

  var ORG_KIND_LABELS = {
    organisation: 'Organisation', university: 'University',
    ngo: 'NGO', government: 'Government'
  };

  var currentReportContext = null;

  function reportHeader(title, subtitle, ctx) {
    var meta = ctx.db.metadata || {};
    return '<div class="report-doc-header">' +
      '<h2>' + escapeHtml(title) + '</h2>' +
      '<div class="report-sub">' + escapeHtml(subtitle) +
        ' \u00b7 Source: ' + escapeHtml(meta.source || 'Unknown') +
        ' \u00b7 Last synchronised: ' + escapeHtml(formatDate(meta.lastSyncedAt)) +
        ' \u00b7 Generated: ' + escapeHtml(formatDate(new Date().toISOString())) +
      '</div></div>';
  }

  function reportSummaryStrip(stats) {
    return '<div class="report-summary-strip">' +
      stats.map(function (s) {
        return '<div class="report-summary-cell"><div class="num">' + escapeHtml(String(s.num)) +
          '</div><div class="label">' + escapeHtml(s.label) + '</div></div>';
      }).join('') +
    '</div>';
  }

  function reportSection(title, bodyHtml) {
    return '<div class="report-section"><h3>' + escapeHtml(title) + '</h3>' + bodyHtml + '</div>';
  }

  function reportList(items, emptyText) {
    if (!items.length) return '<div class="report-empty">' + escapeHtml(emptyText) + '</div>';
    return '<ul class="report-list">' + items.map(function (i) { return '<li>' + escapeHtml(i) + '</li>'; }).join('') + '</ul>';
  }

  function reportTable(headers, rows, emptyText) {
    if (!rows.length) return '<div class="report-empty">' + escapeHtml(emptyText) + '</div>';
    var thead = '<tr>' + headers.map(function (h) { return '<th>' + escapeHtml(h) + '</th>'; }).join('') + '</tr>';
    var tbody = rows.map(function (row) {
      return '<tr>' + row.map(function (cell) {
        var shown = (cell === null || cell === undefined || cell === '') ? '\u2014' : cell;
        return '<td>' + escapeHtml(shown) + '</td>';
      }).join('') + '</tr>';
    }).join('');
    return '<table class="report-table"><thead>' + thead + '</thead><tbody>' + tbody + '</tbody></table>';
  }

  /**
   * buildFundingReport
   * ---------------------------------------------------------------
   * Reuses: Project Intelligence (per-project matched funders and
   * budget), Strategic Opportunity Detection's funding-gap detector,
   * and Timeline Intelligence's funding deadlines.
   */
  function buildFundingReport(ctx) {
    var opp = ctx.opportunities, tl = ctx.timeline, pi = ctx.projectIntel;
    var summary = [
      { num: opp.fundingGaps.unfundedProjects.length, label: 'Unfunded projects' },
      { num: opp.fundingGaps.categoryGaps.length, label: 'Category gaps' },
      { num: opp.fundingGaps.unusedFunders.length, label: 'Unmatched funders' },
      { num: tl.dueWithin30Days, label: 'Due within 30 days' }
    ];
    var pipelineRows = pi.map(function (p) {
      return [p.title, p.status, p.budget, p.fundingNames.length ? p.fundingNames.join(', ') : ''];
    });
    return reportHeader('Funding Strategy', 'Funding pipeline, coverage gaps and upcoming deadlines across the portfolio.', ctx) +
      reportSummaryStrip(summary) +
      reportSection('Funding pipeline by project',
        reportTable(['Project', 'Status', 'Budget', 'Matched funders'], pipelineRows, 'No projects recorded in the Strategic Database yet.')) +
      reportSection('Unfunded projects', reportList(opp.fundingGaps.unfundedProjects, 'Every project has at least one matched funder.')) +
      reportSection('Categories with no funding coverage', reportList(opp.fundingGaps.categoryGaps, 'Every recorded category has at least one matched funder somewhere in it.')) +
      reportSection('Funders not yet matched to a project', reportList(opp.fundingGaps.unusedFunders, 'Every recorded funder is already matched to a project.')) +
      reportSection('Overdue funding deadlines', reportList(tl.deadlinesOverdueItems, 'No overdue funding deadlines.')) +
      reportSection('Upcoming funding deadlines', reportList(tl.deadlinesUpcomingItems, 'No upcoming funding deadlines recorded.'));
  }

  /**
   * buildCollaborationReport
   * ---------------------------------------------------------------
   * Reuses: Organisation Intelligence (relationships, active
   * projects, partners), the Ecosystem Mapping graph's edge count,
   * and Strategic Opportunity Detection's collaborator/partnership
   * detectors.
   */
  function buildCollaborationReport(ctx) {
    var oi = ctx.orgIntel, opp = ctx.opportunities, graph = ctx.graph;
    var summary = [
      { num: oi.length, label: 'Organisations' },
      { num: opp.collaboratorItems.length, label: 'Suggested collaborators' },
      { num: opp.partnershipItems.length, label: 'Partnership opportunities' },
      { num: graph.edges.length, label: 'Recorded relationships' }
    ];
    var orgRows = oi.map(function (o) {
      return [o.title, o.type, String(o.activeProjects.length), String(o.partners.length), String(o.relationships.length)];
    });
    return reportHeader('Collaboration Strategy', 'Existing partnerships and unrealised collaboration opportunities across the ecosystem.', ctx) +
      reportSummaryStrip(summary) +
      reportSection('Organisations',
        reportTable(['Organisation', 'Type', 'Active projects', 'Partners', 'Relationships'], orgRows, 'No organisations recorded in the Strategic Database yet.')) +
      reportSection('Suggested collaborators', reportList(opp.collaboratorItems, 'No organisations already active in a project\u2019s category were found unlinked to it.')) +
      reportSection('New partnership opportunities', reportList(opp.partnershipItems, 'No unconnected organisations share a common project, funder or researcher yet.'));
  }

  /**
   * buildPortfolioReport
   * ---------------------------------------------------------------
   * Reuses: Project Intelligence for the project table, and the same
   * organisation classification Ecosystem Mapping uses to break the
   * organisation count down by type.
   */
  function buildPortfolioReport(ctx) {
    var pi = ctx.projectIntel, db = ctx.db;
    var orgKindCounts = { organisation: 0, university: 0, ngo: 0, government: 0 };
    (Array.isArray(db.organisations) ? db.organisations : []).forEach(function (o) {
      var k = classifyOrganisation(o);
      orgKindCounts[k] = (orgKindCounts[k] || 0) + 1;
    });
    var summary = [
      { num: pi.length, label: 'Projects' },
      { num: countOf(db.organisations), label: 'Organisations' },
      { num: countOf(db.funders), label: 'Funders' },
      { num: countUploadedDocuments(db.projects), label: 'Documents' }
    ];
    var projectRows = pi.map(function (p) {
      return [p.title, p.status, p.category, p.budget, p.timeline, String(p.fundingNames.length), String(p.collaboratorNames.length)];
    });
    var orgRows = Object.keys(orgKindCounts).map(function (k) {
      return [ORG_KIND_LABELS[k] || k, String(orgKindCounts[k])];
    });
    return reportHeader('Portfolio Overview', 'A synthesis of every recorded project and the wider organisational footprint.', ctx) +
      reportSummaryStrip(summary) +
      reportSection('Projects',
        reportTable(['Project', 'Status', 'Category', 'Budget', 'Timeline', 'Funders matched', 'Collaborators'], projectRows, 'No projects recorded in the Strategic Database yet.')) +
      reportSection('Organisations by type', reportTable(['Type', 'Count'], orgRows, 'No organisations recorded in the Strategic Database yet.'));
  }

  /**
   * buildPipelineReport
   * ---------------------------------------------------------------
   * Reuses: Project Intelligence for stage/status, Timeline
   * Intelligence's project milestones, and Strategic Opportunity
   * Detection's duplicate/similar-research findings.
   */
  function buildPipelineReport(ctx) {
    var pi = ctx.projectIntel, tl = ctx.timeline, opp = ctx.opportunities;
    var summary = [
      { num: pi.length, label: 'Projects' },
      { num: tl.milestonesOverdueItems.length, label: 'Overdue milestones' },
      { num: tl.milestonesUpcomingItems.length, label: 'Upcoming milestones' },
      { num: opp.duplicateItems.length + opp.similarItems.length, label: 'Overlap flagged' }
    ];
    var rows = pi.map(function (p) {
      return [p.title, p.status, p.category, p.timeline, String(p.risks.length)];
    });
    return reportHeader('Research Pipeline', 'Every project by stage, with milestone timing and topical overlap.', ctx) +
      reportSummaryStrip(summary) +
      reportSection('Projects by stage',
        reportTable(['Project', 'Status', 'Category', 'Timeline', 'Risks flagged'], rows, 'No projects recorded in the Strategic Database yet.')) +
      reportSection('Overdue milestones', reportList(tl.milestonesOverdueItems, 'No overdue milestones.')) +
      reportSection('Upcoming milestones', reportList(tl.milestonesUpcomingItems, 'No upcoming milestones recorded.')) +
      reportSection('Likely duplicate projects', reportList(opp.duplicateItems, 'No projects with significant title or description overlap were found.')) +
      reportSection('Similar research', reportList(opp.similarItems, 'No projects with moderate topical overlap were found.'));
  }

  /**
   * buildOpportunityReport
   * ---------------------------------------------------------------
   * A print-ready compilation of everything Strategic Opportunity
   * Detection already found \u2014 no new detection logic, just a report
   * layout over the same computed opp object.
   */
  function buildOpportunityReport(ctx) {
    var opp = ctx.opportunities;
    var fundingGapCount = opp.fundingGaps.unfundedProjects.length + opp.fundingGaps.categoryGaps.length + opp.fundingGaps.unusedFunders.length;
    var summary = [
      { num: opp.totalFlagged, label: 'Total flagged' },
      { num: opp.duplicateItems.length, label: 'Duplicate projects' },
      { num: opp.similarItems.length, label: 'Similar research' },
      { num: opp.collaboratorItems.length, label: 'Potential collaborators' },
      { num: fundingGapCount, label: 'Funding gaps' },
      { num: opp.partnershipItems.length, label: 'Partnerships' }
    ];
    return reportHeader('Opportunity Report', 'Every opportunity automatically surfaced from the Strategic Database.', ctx) +
      reportSummaryStrip(summary) +
      reportSection('Duplicate projects', reportList(opp.duplicateItems, 'No projects with significant title or description overlap were found.')) +
      reportSection('Similar research', reportList(opp.similarItems, 'No projects with moderate topical overlap were found.')) +
      reportSection('Potential collaborators', reportList(opp.collaboratorItems, 'No organisations already active in a project\u2019s category were found unlinked to it.')) +
      reportSection('Unfunded projects', reportList(opp.fundingGaps.unfundedProjects, 'Every project has at least one matched funder.')) +
      reportSection('Categories with no funding coverage', reportList(opp.fundingGaps.categoryGaps, 'Every recorded category has at least one matched funder somewhere in it.')) +
      reportSection('Funders not yet matched to a project', reportList(opp.fundingGaps.unusedFunders, 'Every recorded funder is already matched to a project.')) +
      reportSection('New partnership opportunities', reportList(opp.partnershipItems, 'No unconnected organisations share a common project, funder or researcher yet.'));
  }

  function buildReportHtml(typeId, ctx) {
    switch (typeId) {
      case 'funding': return buildFundingReport(ctx);
      case 'collaboration': return buildCollaborationReport(ctx);
      case 'pipeline': return buildPipelineReport(ctx);
      case 'opportunity': return buildOpportunityReport(ctx);
      case 'portfolio': default: return buildPortfolioReport(ctx);
    }
  }

  function renderStrategicReportsSection(containerId) {
    var container = document.getElementById(containerId);
    if (!container) return;

    var options = REPORT_TYPES.map(function (r) {
      return '<option value="' + r.id + '">' + escapeHtml(r.label) + '</option>';
    }).join('');

    container.innerHTML =
      '<div class="reports-toolbar">' +
        '<select id="reportTypeSelect" class="report-select" aria-label="Report type">' + options + '</select>' +
        '<button id="reportExportBtn" class="report-export-btn" type="button">Export as PDF</button>' +
        '<span class="report-meta" id="reportMeta"></span>' +
      '</div>' +
      '<div class="panel report-doc" id="reportPrintArea"></div>';

    var select = document.getElementById('reportTypeSelect');
    var exportBtn = document.getElementById('reportExportBtn');
    var metaEl = document.getElementById('reportMeta');

    function renderCurrent() {
      if (!currentReportContext) return;
      document.getElementById('reportPrintArea').innerHTML = buildReportHtml(select.value, currentReportContext);

        // A descriptive document title so "Save as PDF" in the print
        // dialog defaults to a useful filename instead of the page's

          document.title = 'SIE - ' + label.label + ' - ' + new Date().toISOString().slice(0, 10);
        }
        // Plain browser print, scoped to #reportPrintArea by the print
