  var checkIconSvg =
    '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<path d="M20 6 9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"/>' +
    '</svg>';
  var dashIconSvg =
    '<svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">' +
      '<path d="M5 12h14" stroke-linecap="round"/>' +
    '</svg>';

  // =================================================================
  // Backup \u2014 Export / Import of the Strategic Database
  // -----------------------------------------------------------------
  // Export downloads whatever is currently stored under
  // AAWFIP_StrategicDatabase, byte-for-byte, as a JSON file \u2014 a plain
  // read, no different from the rest of this page. Import is the one
  // deliberate exception to SIE's read-only design: after a person
  // picks a backup file, this shows exactly what is currently stored
  // vs. what the file contains, and only writes to localStorage if
  // they explicitly confirm the restore in that dialog. See the
  // top-of-file comment and the STRATEGIC_DB_STORAGE_KEY comment.
  // =================================================================

  function readRawDb() {
    try {
      return window.localStorage.getItem(STRATEGIC_DB_STORAGE_KEY);
    } catch (e) {
      return null;
    }
  }

  function backupSummaryRows(db) {
    if (!db || typeof db !== 'object') return null;
    var meta = db.metadata || {};
    return [
      { label: 'Projects', num: countOf(db.projects) },
      { label: 'Organisations', num: countOf(db.organisations) },
      { label: 'Funders', num: countOf(db.funders) },
      { label: 'Last synchronised', num: formatDate(meta.lastSyncedAt) }
    ];
  }

  function renderCompareCol(title, rows, fallbackText) {
    var body = rows
      ? rows.map(function (r) { return '<div>' + escapeHtml(r.label) + ': <strong>' + escapeHtml(String(r.num)) + '</strong></div>'; }).join('')
      : '<div style="color:var(--text-lo);font-style:italic;">' + escapeHtml(fallbackText) + '</div>';
    return '<div class="col"><h4>' + escapeHtml(title) + '</h4>' + body + '</div>';
  }

  function closeRestoreModal() {
    var mount = document.getElementById('modalMount');
    if (mount) mount.innerHTML = '';
  }

  var backupStatusTimer = null;
  function setBackupStatus(msg, kind) {
    var el = document.getElementById('backupStatusMsg');
    if (!el) return;
    el.textContent = msg;
    el.className = 'backup-status' + (kind ? ' ' + kind : '');
    if (backupStatusTimer) clearTimeout(backupStatusTimer);
    if (msg) {
      backupStatusTimer = setTimeout(function () {
        el.textContent = '';
        el.className = 'backup-status';
      }, 6000);
    }
  }

  function performRestore(rawText) {
    try {
      window.localStorage.setItem(STRATEGIC_DB_STORAGE_KEY, rawText);
    } catch (e) {
      closeRestoreModal();
      setBackupStatus('Restore failed: ' + (e && e.message ? e.message : 'could not write to local storage') + '.', 'err');
      return;
    }
    closeRestoreModal();
    setBackupStatus('Restored \u2014 reloading\u2026', 'ok');
    setTimeout(function () { window.location.reload(); }, 500);
  }

  function openRestoreConfirmModal(fileName, rawText, incomingDb) {
    var current = loadResult();
    var currentRows = current.state === 'valid' ? backupSummaryRows(current.db) : null;
    var currentFallback = current.state === 'missing' ? 'No Strategic Database currently stored.' : 'Currently stored data could not be read.';
    var incomingRows = backupSummaryRows(incomingDb);

    var mount = document.getElementById('modalMount');
    if (!mount) return;
    mount.innerHTML =
      '<div class="modal-overlay" id="restoreOverlay">' +
        '<div class="modal">' +
          '<h2>Restore from backup?</h2>' +
          '<p>You are about to replace this browser\u2019s <code>AAWFIP_StrategicDatabase</code> with the contents of ' +
            '<strong>' + escapeHtml(fileName) + '</strong>. AAWFIP will use the restored data the next time it reads this key.</p>' +
          '<div class="modal-compare">' +
            renderCompareCol('Currently stored', currentRows, currentFallback) +
            renderCompareCol('Backup file', incomingRows, 'Backup file has no recognisable collections.') +
          '</div>' +
          '<div class="modal-warning">This replaces the current data in this browser and can\u2019t be undone from here \u2014 export a backup of the current data first if you want to keep it.</div>' +
          '<div class="modal-actions">' +
            '<button type="button" class="modal-btn cancel" id="restoreCancelBtn">Cancel</button>' +
            '<button type="button" class="modal-btn confirm" id="restoreConfirmBtn">Restore backup</button>' +
          '</div>' +
        '</div>' +
      '</div>';

    document.getElementById('restoreCancelBtn').addEventListener('click', closeRestoreModal);
    document.getElementById('restoreOverlay').addEventListener('click', function (e) {
      if (e.target.id === 'restoreOverlay') closeRestoreModal();
    });
    document.getElementById('restoreConfirmBtn').addEventListener('click', function () {
      performRestore(rawText);
    });
  }

  function triggerExport() {
    var raw = readRawDb();
    if (raw === null) {
      setBackupStatus('Nothing to export yet.', 'err');
      return;
    }
    var stamp = new Date().toISOString().replace(/[:.]/g, '-');
    var filename = 'AAWFIP_StrategicDatabase-backup-' + stamp + '.json';
    var blob = new Blob([raw], { type: 'application/json' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
    setBackupStatus('Exported ' + filename, 'ok');
  }

  function handleImportFile(file) {
    if (!file) return;
    setBackupStatus('Reading ' + file.name + '\u2026', '');
    var reader = new FileReader();
    reader.onerror = function () {
      setBackupStatus('Could not read that file.', 'err');
    };
    reader.onload = function () {
      var text = String(reader.result || '');
      var parsed;
      try {
        parsed = JSON.parse(text);
      } catch (e) {
        setBackupStatus('That file is not valid JSON.', 'err');
        return;
      }
      if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
        setBackupStatus('That file is not a Strategic Database object.', 'err');
        return;
      }
      setBackupStatus('', '');
      openRestoreConfirmModal(file.name, text, parsed);
    };
    reader.readAsText(file);
  }

  var uploadIconSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M12 4l-4 4M12 4l4 4M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  var downloadIconSvg =
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12M12 16l-4-4M12 16l4-4M4 20h16" stroke-linecap="round" stroke-linejoin="round"/></svg>';

  /**
   * renderBackupControls
   * ---------------------------------------------------------------
   * Populates the header's Export/Import controls. Called once from
   * init(), independent of whether a database is currently present,
   * so Import is always available even on a browser with nothing
   * stored yet (e.g. restoring onto a fresh browser).
   */
  function renderBackupControls() {
    var el = document.getElementById('backupControls');
    if (!el) return;
    var hasData = readRawDb() !== null;
    el.innerHTML =
      '<button type="button" class="backup-btn" id="exportBackupBtn" title="Download the current Strategic Database as a JSON backup file"' + (hasData ? '' : ' disabled') + '>' +
        downloadIconSvg + '<span>Export backup</span>' +
      '</button>' +
      '<button type="button" class="backup-btn" id="importBackupBtn" title="Restore a previously exported Strategic Database backup">' +
        uploadIconSvg + '<span>Import backup</span>' +
      '</button>' +
      '<input type="file" id="importBackupInput" accept="application/json,.json" style="display:none;">' +
      '<span class="backup-status" id="backupStatusMsg"></span>';

    document.getElementById('exportBackupBtn').addEventListener('click', triggerExport);
    var fileInput = document.getElementById('importBackupInput');
    document.getElementById('importBackupBtn').addEventListener('click', function () { fileInput.click(); });
    fileInput.addEventListener('change', function (e) {
      var file = e.target.files && e.target.files[0];
      handleImportFile(file);
      fileInput.value = '';
    });
  }

  function renderMissing() {
    document.getElementById('pageMeta').textContent = 'No Strategic Database found in this browser';
    document.getElementById('panel').innerHTML =
      '<div class="empty-state">' +
        '<svg class="empty-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<circle cx="12" cy="12" r="9"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16.2" r="0.6" fill="currentColor" stroke="none"/>' +
        '</svg>' +
        '<h2>No Strategic Intelligence data yet</h2>' +
        '<p>This browser doesn\u2019t have an <code>AAWFIP_StrategicDatabase</code> saved yet. ' +
        'Open AAWFIP and click &ldquo;Synchronise Strategic Intelligence&rdquo; first, then come back and reload this page \u2014 ' +
        'or use Backup &gt; Import above to restore a previously exported backup.</p>' +
      '</div>';
  }

  function renderInvalid(reason) {
    document.getElementById('pageMeta').textContent = 'Strategic Database could not be validated';
    document.getElementById('panel').innerHTML =
      '<div class="empty-state invalid-state">' +
        '<svg class="empty-mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
          '<circle cx="12" cy="12" r="9"/><path d="M12 8v5" stroke-linecap="round"/><circle cx="12" cy="16.2" r="0.6" fill="currentColor" stroke="none"/>' +
        '</svg>' +
        '<h2>Strategic Database found, but unreadable</h2>' +
        '<p>' + escapeHtml(reason) + ' Try synchronising again from AAWFIP, or use Backup &gt; Import above to restore a known-good backup. ' +
        'SIE only ever writes to storage through that explicit, confirmed action, so nothing here is changed just by viewing this page.</p>' +
      '</div>';
  }

  function renderValid(db) {
    var meta = db.metadata || {};
    document.getElementById('pageMeta').textContent = 'Strategic Database loaded and validated successfully';

    // Computed once, up front, so the Strategic Dashboard stat strip,
    // the Ecosystem Mapping graph, and Strategic Opportunity Detection
    // all read from the exact same graph/opportunity data below.
    var ecosystemGraph = buildEcosystemGraph(db);
    var opportunities = computeStrategicOpportunities(db, ecosystemGraph);
    var timeline = computeTimelineIntelligence(db);
    var integrity = computeDataIntegrity(db);

    // --- Strategic Dashboard --------------------------------------
    // Exactly the summary statistics requested for this stage, each
    // read straight off the synchronised database — nothing computed
    // here is invented or estimated.
    //
    // "Number of uploaded documents" sums each project's own
    // uploadedDocuments array (see countUploadedDocuments above).
    //
    // "Number of applications" reads db.applications the same
    // defensive way every other collection on this page is read
    // (countOf — 0 if missing or not an array). AAWFIP does not yet
    // export a structured `applications` collection into the
    // Strategic Database (its own Notes & Tracker "Application
    // tracker" widget is a UI placeholder, not synced data), so this
    // reads 0 today. It is wired to the real field name rather than
    // hidden or hard-coded, so it will reflect real data the moment a
    // future sync populates db.applications — nothing is invented in
    // the meantime.
    var dashboardStats = [
      { num: countOf(db.projects), label: 'Projects' },
      { num: countOf(db.organisations), label: 'Organisations' },
      { num: countOf(db.funders), label: 'Funders' },
      { num: countUploadedDocuments(db.projects), label: 'Uploaded documents' },
      { num: countOf(db.applications), label: 'Applications' },
      { num: opportunities.totalFlagged, label: 'Opportunities flagged' },
      { num: timeline.dueWithin30Days, label: 'Due within 30 days' },
      { num: formatDate(meta.lastSyncedAt), label: 'Last synchronised' }
    ];

    var checklist = EXPECTED_COLLECTIONS.map(function (key) {
      var present = Object.prototype.hasOwnProperty.call(db, key);
      return '<li class="' + (present ? 'present' : 'missing') + '">' +
        (present ? checkIconSvg : dashIconSvg) +
        '<span>' + escapeHtml(key) + '</span>' +
      '</li>';
    }).join('');

    var searchIndex = buildSearchIndex(db);
    var projectIntel = buildProjectIntelligence(db);
    var orgIntel = buildOrganisationIntelligence(db);

    document.getElementById('panel').innerHTML =
      '<div class="search-section">' +
        '<div class="section-label">Global Search</div>' +
        '<input type="text" id="globalSearchInput" class="search-input" autocomplete="off" ' +
          'placeholder="Search projects, organisations, funders, documents, notes\u2026">' +
        '<div class="filter-chips" id="searchFilterChips"></div>' +
        '<div class="search-results" id="globalSearchResults"></div>' +
      '</div>' +
      '<div class="validated-header">' +
        '<svg class="validated-badge" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">' +
          '<circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.5 2.5L16 9" stroke-linecap="round" stroke-linejoin="round"/>' +
        '</svg>' +
        '<div>' +
          '<h2>Strategic Database loaded</h2>' +
          '<div class="sub">Read from this browser\u2019s AAWFIP_StrategicDatabase. SIE only writes back to storage if you explicitly restore a backup via Backup &gt; Import above.</div>' +
        '</div>' +
      '</div>' +
      '<div class="dash-heading">Strategic Dashboard</div>' +
      '<div class="dash-stat-strip">' +
        dashboardStats.map(function (s) {
          return '<div class="dash-stat-cell"><div class="num">' + escapeHtml(s.num) + '</div><div class="label">' + escapeHtml(s.label) + '</div></div>';
        }).join('') +
      '</div>' +
      '<div class="section-label">Database structure (schema v' + escapeHtml(meta.schemaVersion != null ? meta.schemaVersion : '\u2014') +
        (integrity.versionCheck.status === 'current' ? '' :
          ' <span class="integrity-pill ' + (integrity.versionCheck.status === 'unknown' ? 'warn' : 'warn') + '" style="margin-left:8px;">' +
          (integrity.versionCheck.status === 'outdated' ? 'Outdated' : integrity.versionCheck.status === 'newer' ? 'Newer than SIE' : 'Unversioned') +
          '</span>') +
        ')</div>' +
      '<ul class="check-list">' + checklist + '</ul>' +
      '<div class="status-note">Source: ' + escapeHtml(meta.source || 'Unknown') + '</div>' +
      '<div class="section-label" style="margin-top:34px;">Data Integrity &amp; Synchronisation</div>' +
      '<div id="dataIntegrity" class="data-integrity"></div>' +
      '<div class="section-label" style="margin-top:34px;">Project Intelligence</div>' +
      '<div class="filter-chips" id="projectFilterChips"></div>' +
      '<div class="project-intel" id="projectIntelList" style="margin-top:14px;"></div>' +
      '<div class="section-label" style="margin-top:34px;">Organisation Intelligence</div>' +
      '<div class="project-intel">' + renderOrganisationIntelligence(orgIntel) + '</div>' +
      '<div class="section-label" style="margin-top:34px;">Ecosystem Mapping</div>' +
      '<div id="ecosystemMapping" class="ecosystem-mapping"></div>' +
      '<div class="section-label" style="margin-top:34px;">Strategic Opportunity Detection</div>' +
      '<div id="opportunityDetection" class="opportunity-detection"></div>' +
      '<div class="section-label" style="margin-top:34px;">Timeline Intelligence</div>' +
      '<div id="timelineIntelligence" class="timeline-intelligence"></div>' +
      '<div class="section-label" style="margin-top:34px;">Strategic Reports</div>' +
      '<div id="strategicReports" class="strategic-reports"></div>';

    // --- Global Search: category filter chips -----------------------
    // 'All' plus one chip per SEARCH_CATEGORY_ORDER entry, each showing
    // how many indexed records exist in that category. Picking a chip
    // restricts runSearch to that category and also allows browsing it
    // with an empty query (bypassing the minimum-query-length hint).
    var searchCategoryCounts = { All: searchIndex.length };
    SEARCH_CATEGORY_ORDER.forEach(function (c) { searchCategoryCounts[c] = 0; });
    searchIndex.forEach(function (rec) { searchCategoryCounts[rec.category] = (searchCategoryCounts[rec.category] || 0) + 1; });

    var activeSearchCategory = 'All';

    function renderSearchFilterChips() {
      var chipsEl = document.getElementById('searchFilterChips');
      if (!chipsEl) return;
      var cats = ['All'].concat(SEARCH_CATEGORY_ORDER);
      chipsEl.innerHTML = cats.map(function (c) {
        return '<button type="button" class="filter-chip' + (c === activeSearchCategory ? ' active' : '') + '" data-cat="' + escapeHtml(c) + '">' +
          escapeHtml(c) + ' <span class="filter-chip-count">' + searchCategoryCounts[c] + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(chipsEl.querySelectorAll('.filter-chip'), function (btn) {
        btn.addEventListener('click', function () {
          activeSearchCategory = btn.getAttribute('data-cat');
          refreshSearch();
        });
      });
    }

    function refreshSearch() {
      var value = document.getElementById('globalSearchInput').value;
      renderSearchFilterChips();
      renderSearchResults(runSearch(searchIndex, value, activeSearchCategory), value, activeSearchCategory);
    }

    // --- Project Intelligence: status filter chips -------------------
    // Built from the distinct status values actually present on the
    // computed project records — nothing invented, no fixed status
    // list assumed. 'All' plus one chip per distinct status found.
    var projectStatusCounts = { All: projectIntel.length };
    projectIntel.forEach(function (pi) {
      var key = pi.status ? pi.status : 'No status recorded';
      projectStatusCounts[key] = (projectStatusCounts[key] || 0) + 1;
    });
    var projectStatusOrder = Object.keys(projectStatusCounts).filter(function (k) { return k !== 'All'; }).sort();
    var activeProjectStatus = 'All';

    function renderProjectFilterChips() {
      var chipsEl = document.getElementById('projectFilterChips');
      if (!chipsEl) return;
      if (projectStatusOrder.length < 2) { chipsEl.innerHTML = ''; return; }
      var cats = ['All'].concat(projectStatusOrder);
      chipsEl.innerHTML = cats.map(function (c) {
        return '<button type="button" class="filter-chip' + (c === activeProjectStatus ? ' active' : '') + '" data-status="' + escapeHtml(c) + '">' +
          escapeHtml(c) + ' <span class="filter-chip-count">' + projectStatusCounts[c] + '</span></button>';
      }).join('');
      Array.prototype.forEach.call(chipsEl.querySelectorAll('.filter-chip'), function (btn) {
        btn.addEventListener('click', function () {
          activeProjectStatus = btn.getAttribute('data-status');
          refreshProjectIntel();
        });
      });
    }

    function refreshProjectIntel() {
      renderProjectFilterChips();
      var filtered = activeProjectStatus === 'All' ? projectIntel : projectIntel.filter(function (pi) {
        return (pi.status ? pi.status : 'No status recorded') === activeProjectStatus;
      });
      document.getElementById('projectIntelList').innerHTML = renderProjectIntelligence(filtered);
    }

    renderSearchResults(null, '', 'All');
    renderSearchFilterChips();
    refreshProjectIntel();
    renderEcosystemGraph('ecosystemMapping', ecosystemGraph);
    renderOpportunityDetection('opportunityDetection', opportunities);
    renderTimelineIntelligence('timelineIntelligence', timeline);
    renderDataIntegrity('dataIntegrity', integrity);
    currentReportContext = {
      db: db, graph: ecosystemGraph, opportunities: opportunities,
      timeline: timeline, projectIntel: projectIntel, orgIntel: orgIntel,
      integrity: integrity
    };
    renderStrategicReportsSection('strategicReports');

    var searchDebounce = null;
    document.getElementById('globalSearchInput').addEventListener('input', function (e) {
      if (searchDebounce) clearTimeout(searchDebounce);
      searchDebounce = setTimeout(refreshSearch, 120);
    });
  }

  /**
   * showProcessingState
   * ---------------------------------------------------------------
   * A validated database still has to run buildEcosystemGraph,
   * computeStrategicOpportunities, buildProjectIntelligence, etc.
   * before renderValid can paint anything — synchronous work that
   * can take a moment on a large Strategic Database. This puts a
   * real, visible spinner up first so that work is never silent.
   */
  function showProcessingState() {
    document.getElementById('pageMeta').textContent = 'Strategic Database found \u2014 building Strategic Intelligence views\u2026';
    document.getElementById('panel').innerHTML =
      '<div class="loading-state"><div class="spinner"></div><p>Building Strategic Intelligence views\u2026</p></div>';
  }

  function init() {
    renderBackupControls();

    var result = loadResult();
    if (result.state === 'missing') {
      renderMissing();
    } else if (result.state === 'invalid') {
      renderInvalid(result.reason);
    } else {
      showProcessingState();
      // Give the browser a frame to actually paint the spinner above
      // before the heavy, synchronous render work below blocks the
      // main thread — otherwise the loading state would never be
      // visible even for a large database.
      window.requestAnimationFrame(function () {
        setTimeout(function () { renderValid(result.db); }, 0);
      });
    }
  }

  // Same reasoning as showProcessingState: defer the very first call
  // so the "Loading AAWFIP_StrategicDatabase…" state already present
  // in the static HTML gets painted before init() does any work.
  window.requestAnimationFrame(function () {
    setTimeout(init, 0);
  });
})();
</script>

</body>
</html>
